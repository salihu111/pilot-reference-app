<!doctype html>
<html lang="en">
<head>
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pilot Reference</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0a0d11;
    --panel: #10151b;
    --panel-2: #151b22;
    --line: #212a33;
    --text: #e6edf2;
    --muted: #7d8b98;
    --cyan: #3fc6d4;
    --amber: #e0a53f;
    --magenta: #c481d1;
    --green: #4cad6f;
    --red: #dd5c53;
  }
  body { background: var(--ink); color: var(--text); font-family: 'Inter', -apple-system, sans-serif; }
  .font-display { font-family: 'Space Grotesk', 'Inter', sans-serif; }
  .font-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  ::-webkit-scrollbar { width:6px; height:6px; } ::-webkit-scrollbar-thumb { background:var(--line); border-radius:3px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">

const { useState, useEffect, useRef } = React;

const API = window.API_BASE || (window.location.origin + "/api");
function tg() { return window.Telegram ? window.Telegram.WebApp : null; }

// ---------- shared bits ----------

function Panel({ children, className="" }) {
  return <div className={`bg-[var(--panel)] border border-[var(--line)] rounded-lg ${className}`}>{children}</div>;
}

function Label({ children }) {
  return <div className="text-[11px] text-[var(--muted)] mb-1.5">{children}</div>;
}

function StatChip({ label, value, accent="cyan" }) {
  const colors = { cyan:"text-[var(--cyan)]", amber:"text-[var(--amber)]", magenta:"text-[var(--magenta)]", green:"text-[var(--green)]", red:"text-[var(--red)]" };
  if (!value) return null;
  return (
    <div className="bg-[var(--panel-2)] border border-[var(--line)] rounded-md px-2.5 py-1.5 min-w-[64px]">
      <div className="text-[10px] text-[var(--muted)]">{label}</div>
      <div className={`font-mono text-sm ${colors[accent]}`}>{value}</div>
    </div>
  );
}

function UTCClock() {
  const [now, setNow] = useState(new Date());
  useEffect(() => { const t = setInterval(()=>setNow(new Date()), 1000); return ()=>clearInterval(t); }, []);
  const hh = String(now.getUTCHours()).padStart(2,"0");
  const mm = String(now.getUTCMinutes()).padStart(2,"0");
  const ss = String(now.getUTCSeconds()).padStart(2,"0");
  return <span className="font-mono text-xs text-[var(--muted)]">{hh}:{mm}:{ss}Z</span>;
}

function timeAgo(iso) {
  if (!iso) return null;
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.round(diffMs / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.round(mins/60);
  return `${hrs}h ago`;
}

// ---------- shell ----------

function Header({ tab, setTab }) {
  const tabs = ["Overview", "Ask", "Documents", "Legality", "Airports", "Escape Routes", "Bulletins", "Salary"];
  return (
    <div className="sticky top-0 z-10 bg-[var(--ink)]">
      <div className="flex items-center justify-between px-4 pt-3 pb-2 border-b border-[var(--line)]">
        <div className="font-display font-semibold text-[15px] tracking-tight">Pilot Reference</div>
        <UTCClock/>
      </div>
      <div className="flex gap-4 overflow-x-auto px-4 border-b border-[var(--line)]">
        {tabs.map(t => (
          <button key={t} onClick={()=>setTab(t)}
            className={`whitespace-nowrap text-sm py-2.5 border-b-2 transition-colors ${tab===t ? "border-[var(--cyan)] text-[var(--text)]" : "border-transparent text-[var(--muted)]"}`}>
            {t}
          </button>
        ))}
      </div>
    </div>
  );
}

// ---------- Overview ----------

function OverviewTab({ setTab }) {
  const [stats, setStats] = useState(null);
  useEffect(() => { fetch(`${API}/overview`).then(r=>r.json()).then(setStats); }, []);

  const widgets = stats ? [
    { label: "Manuals indexed", value: stats.documents, accent: "cyan" },
    { label: "Airports loaded", value: stats.airports, accent: "magenta" },
    { label: "SID / escape refs", value: stats.references, accent: "amber" },
    { label: "Bulletins pending", value: stats.bulletins_active, accent: stats.bulletins_active > 0 ? "red" : "green" },
  ] : [];

  return (
    <div className="p-4">
      <div className="grid grid-cols-2 gap-3">
        {widgets.map((w,i) => (
          <Panel key={i} className="p-4">
            <div className={`font-display text-3xl text-[var(--${w.accent})]`}>{w.value ?? "–"}</div>
            <div className="text-xs text-[var(--muted)] mt-1">{w.label}</div>
          </Panel>
        ))}
      </div>

      {stats && stats.latest_bulletin && (
        <Panel className="p-4 mt-3">
          <Label>Latest bulletin</Label>
          <div className="text-sm">{stats.latest_bulletin.title}</div>
          <div className="text-xs text-[var(--muted)] mt-1">{stats.latest_bulletin.created_at}</div>
        </Panel>
      )}

      <div className="mt-4">
        <Label>Quick actions</Label>
        <div className="flex flex-wrap gap-2">
          {[
            ["Ask a question", "Ask"],
            ["Browse airports", "Airports"],
            ["Check a duty", "Legality"],
            ["New bulletin", "Bulletins"],
          ].map(([label, target]) => (
            <button key={target} onClick={()=>setTab(target)}
              className="text-sm bg-[var(--panel-2)] border border-[var(--line)] rounded-md px-3 py-2 hover:border-[var(--cyan)]">
              {label}
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

// ---------- Ask ----------

function AskTab() {
  const [docs, setDocs] = useState([]);
  const [selected, setSelected] = useState([]);
  const [query, setQuery] = useState("");
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);
  const [activeCitation, setActiveCitation] = useState(null);

  useEffect(() => { fetch(`${API}/documents`).then(r=>r.json()).then(setDocs); }, []);
  const toggleDoc = (id) => setSelected(s => s.includes(id) ? s.filter(x=>x!==id) : [...s, id]);

  const ask = async () => {
    if (!query.trim()) return;
    setLoading(true); setResult(null);
    const form = new FormData();
    form.append("query", query);
    if (selected.length) form.append("doc_ids", selected.join(","));
    try {
      const res = await fetch(`${API}/ask`, { method: "POST", body: form });
      setResult(await res.json());
    } catch (e) { setResult({ answer: "Request failed: " + e.message, citations: [] }); }
    setLoading(false);
  };

  return (
    <div className="grid md:grid-cols-2 gap-3 p-4">
      <Panel className="p-4">
        <Label>Search scope</Label>
        <div className="flex flex-wrap gap-2 mb-3">
          {docs.map(d => (
            <button key={d.id} onClick={()=>toggleDoc(d.id)}
              className={`text-xs px-2 py-1 rounded-md border ${selected.includes(d.id) ? "border-[var(--cyan)] bg-[var(--panel-2)] text-[var(--cyan)]" : "border-[var(--line)] text-[var(--muted)]"}`}>
              {d.title || d.filename}
            </button>
          ))}
          {docs.length===0 && <div className="text-sm text-[var(--muted)]">Upload PDFs in Documents first.</div>}
        </div>
        <div className="text-[11px] text-[var(--muted)] mb-3">
          {selected.length===0 ? "Searching all uploaded documents." : `Searching ${selected.length} selected document(s).`}
        </div>
        <textarea value={query} onChange={e=>setQuery(e.target.value)} rows={3}
          placeholder="e.g. What is the MEL dispatch limit for the APU?"
          className="w-full bg-[var(--panel-2)] border border-[var(--line)] rounded-lg p-2 text-sm outline-none focus:border-[var(--cyan)]" />
        <button onClick={ask} disabled={loading}
          className="mt-2 w-full bg-[var(--cyan)] text-[var(--ink)] text-sm font-medium py-2 rounded-lg disabled:opacity-50">
          {loading ? "Searching…" : "Ask"}
        </button>
      </Panel>

      <Panel className="p-4">
        <Label>Answer</Label>
        {!result && <div className="text-sm text-[var(--muted)]">Answer and page citations will appear here.</div>}
        {result && (
          <div>
            <div className="text-sm whitespace-pre-wrap leading-relaxed mb-3">{result.answer}</div>
            <Label>Citations</Label>
            <div className="flex flex-col gap-2">
              {result.citations && result.citations.map((c,i) => (
                <button key={i} onClick={()=>setActiveCitation(c)}
                  className="text-left text-xs border border-[var(--line)] rounded-lg p-2 hover:border-[var(--cyan)]">
                  <div className="font-medium text-[var(--cyan)]">{c.title} — p.{c.page}</div>
                  <div className="text-[var(--muted)] mt-1 line-clamp-2">{c.excerpt}</div>
                </button>
              ))}
            </div>
          </div>
        )}
        {activeCitation && (
          <div className="mt-3 border-t border-[var(--line)] pt-3">
            <Label>Page {activeCitation.page} preview</Label>
            <img
              src={`${API}/documents/${activeCitation.doc_id}/page/${activeCitation.page}/screenshot?highlight=${encodeURIComponent(activeCitation.excerpt.slice(0,60))}`}
              className="w-full rounded-lg border border-[var(--line)]" />
          </div>
        )}
      </Panel>
    </div>
  );
}

// ---------- Documents ----------

function DocumentsTab() {
  const [docs, setDocs] = useState([]);
  const [uploading, setUploading] = useState(false);
  const load = () => fetch(`${API}/documents`).then(r=>r.json()).then(setDocs);
  useEffect(load, []);

  const onFile = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setUploading(true);
    const form = new FormData();
    form.append("file", file);
    form.append("title", file.name.replace(/\.pdf$/i,""));
    await fetch(`${API}/documents/upload`, { method:"POST", body: form });
    setUploading(false);
    load();
  };

  return (
    <div className="p-4">
      <Panel className="p-4">
        <div className="text-sm mb-2">Upload a PDF — FOM, FCOM, QRH, DDG, FRM. It's embedded and indexed for search across every tab.</div>
        <input type="file" accept="application/pdf" onChange={onFile} className="text-sm" />
        {uploading && <div className="text-xs text-[var(--muted)] mt-2">Indexing… this can take a minute for large manuals.</div>}
      </Panel>
      <div className="grid md:grid-cols-2 gap-3 mt-3">
        {docs.map(d => (
          <Panel key={d.id} className="p-4">
            <div className="font-medium text-sm">{d.title}</div>
            <div className="text-xs text-[var(--muted)] mt-1">{d.num_pages} pages · uploaded {d.uploaded_at}</div>
          </Panel>
        ))}
      </div>
    </div>
  );
}

// ---------- Legality ----------

function LegalityTab() {
  const [desc, setDesc] = useState("");
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);

  const check = async () => {
    if (!desc.trim()) return;
    setLoading(true); setResult(null);
    const form = new FormData();
    form.append("duty_description", desc);
    const res = await fetch(`${API}/legal-check`, { method:"POST", body: form });
    setResult(await res.json());
    setLoading(false);
  };

  return (
    <div className="p-4 grid md:grid-cols-2 gap-3">
      <Panel className="p-4">
        <Label>Duty / FTL cross-check</Label>
        <textarea value={desc} onChange={e=>setDesc(e.target.value)} rows={5}
          placeholder="e.g. Report 03:00L, 4 sectors, last sector ETA 14:30L, previous rest was 10h at home base…"
          className="w-full bg-[var(--panel-2)] border border-[var(--line)] rounded-lg p-2 text-sm outline-none focus:border-[var(--cyan)]" />
        <button onClick={check} disabled={loading}
          className="mt-2 w-full bg-[var(--cyan)] text-[var(--ink)] text-sm font-medium py-2 rounded-lg disabled:opacity-50">
          {loading ? "Checking…" : "Check against my FRM/FOM"}
        </button>
        <div className="text-[11px] text-[var(--muted)] mt-2">Advisory only — cross-checks against your own uploaded manuals. Confirm with crew scheduling/OCC.</div>
      </Panel>
      <Panel className="p-4">
        {!result && <div className="text-sm text-[var(--muted)]">Assessment will appear here.</div>}
        {result && (
          <div>
            <div className="text-sm whitespace-pre-wrap leading-relaxed">{result.assessment || result.explanation}</div>
            {result.citations && result.citations.map((c,i)=>(
              <div key={i} className="text-xs border border-[var(--line)] rounded-lg p-2 mt-2">
                <div className="text-[var(--cyan)] font-medium">{c.title} — p.{c.page}</div>
                <div className="text-[var(--muted)] mt-1">{c.excerpt}</div>
              </div>
            ))}
          </div>
        )}
      </Panel>
    </div>
  );
}

// ---------- Airports ----------

function extractRawText(obj, keys) {
  if (!obj) return null;
  if (Array.isArray(obj)) obj = obj[0];
  if (!obj || typeof obj !== "object") return null;
  for (const k of keys) { if (obj[k]) return obj[k]; }
  return null;
}

function WeatherPanel({ icao, initialWeather, initialNotams, initialUpdatedAt }) {
  const [weather, setWeather] = useState(initialWeather);
  const [notams, setNotams] = useState(initialNotams);
  const [updatedAt, setUpdatedAt] = useState(initialUpdatedAt);
  const [refreshing, setRefreshing] = useState(false);
  const intervalRef = useRef(null);

  const refresh = async () => {
    setRefreshing(true);
    try {
      const res = await fetch(`${API}/airports/${icao}/sync`);
      const data = await res.json();
      setWeather(data.weather); setNotams(data.notams); setUpdatedAt(data.updated_at);
    } catch (e) {}
    setRefreshing(false);
  };

  useEffect(() => {
    if (!updatedAt) refresh(); // auto-fetch on first open if nothing cached
    intervalRef.current = setInterval(refresh, 5 * 60 * 1000); // auto-refresh every 5 min while open
    return () => clearInterval(intervalRef.current);
  }, [icao]);

  const metarText = extractRawText(weather && weather.metar, ["rawOb", "raw_text", "rawText", "metar"]);
  const tafText = extractRawText(weather && weather.taf, ["rawTAF", "raw_text", "rawText", "taf"]);
  const weatherError = weather && weather.error;
  const notamError = notams && notams.error;
  const notamList = notams && Array.isArray(notams.data) ? notams.data : null;

  return (
    <div className="grid gap-3 mt-3">
      <Panel className="p-4">
        <div className="flex items-center justify-between mb-2">
          <Label>Weather</Label>
          <div className="flex items-center gap-2">
            {updatedAt && <span className="text-[11px] text-[var(--muted)]">{timeAgo(updatedAt)}</span>}
            <button onClick={refresh} disabled={refreshing}
              className="text-xs bg-[var(--panel-2)] border border-[var(--line)] rounded-md px-2 py-1 disabled:opacity-50">
              {refreshing ? "Syncing…" : "Refresh"}
            </button>
          </div>
        </div>
        {weatherError && <div className="text-xs text-[var(--red)]">{weatherError}</div>}
        {!weatherError && (
          <div className="font-mono text-xs space-y-2">
            <div><span className="text-[var(--muted)]">METAR </span>{metarText || "no data yet"}</div>
            <div><span className="text-[var(--muted)]">TAF </span>{tafText || "no data yet"}</div>
          </div>
        )}
      </Panel>

      <Panel className="p-4">
        <Label>NOTAMs</Label>
        {notamError && <div className="text-xs text-[var(--amber)]">{notamError}</div>}
        {!notamError && notamList && notamList.length > 0 && (
          <div className="flex flex-col gap-2">
            {notamList.slice(0,8).map((n,i) => (
              <div key={i} className="font-mono text-[11px] border border-[var(--line)] rounded-md p-2 text-[var(--text)]">
                {n.raw || JSON.stringify(n)}
              </div>
            ))}
          </div>
        )}
        {!notamError && (!notamList || notamList.length===0) && (
          <div className="text-xs text-[var(--muted)]">No active NOTAMs returned.</div>
        )}
      </Panel>
    </div>
  );
}

function AirportDetail({ icao, onClose }) {
  const [data, setData] = useState(null);
  const [showRaw, setShowRaw] = useState(false);

  useEffect(() => {
    fetch(`${API}/airports/${icao}/briefing`).then(r=>r.json()).then(setData);
  }, [icao]);

  if (!data) return null;
  const f = data.fields || {};

  return (
    <div className="fixed inset-0 bg-black/80 flex items-start justify-center overflow-auto p-3 z-20" onClick={onClose}>
      <div className="bg-[var(--ink)] border border-[var(--line)] rounded-xl p-4 max-w-2xl w-full mt-4 mb-8" onClick={e=>e.stopPropagation()}>
        <div className="flex justify-between items-start mb-3">
          <div>
            <div className="font-display text-2xl">
              {data.icao} {data.icao_real && <span className="text-[var(--cyan)]">/ {data.icao_real}</span>}
            </div>
            {f.alternates && <div className="text-xs text-[var(--muted)] mt-1">Alternates: <span className="font-mono text-[var(--amber)]">{f.alternates}</span></div>}
          </div>
          <button onClick={onClose} className="text-[var(--muted)] text-sm">Close</button>
        </div>

        <div className="flex flex-wrap gap-2">
          <StatChip label="Runway" value={f.rw} accent="cyan" />
          <StatChip label="Elevation" value={f.elev ? `${f.elev} ft` : null} accent="cyan" />
          <StatChip label="UTC" value={f.utc} accent="cyan" />
          <StatChip label="Category" value={f.cat} accent="amber" />
          <StatChip label="TL/TA" value={f.tl_ta} accent="magenta" />
          <StatChip label="EO alt" value={f.eo_alt} accent="magenta" />
        </div>

        {(f.ops || f.sid || f.exit || f.set_crs) && (
          <Panel className="p-4 mt-3">
            <Label>Departure &amp; routing</Label>
            <div className="font-mono text-xs space-y-1.5">
              {f.ops && <div><span className="text-[var(--muted)]">OPS </span>{f.ops}</div>}
              {f.sid && <div><span className="text-[var(--muted)]">SID </span><span className="text-[var(--magenta)]">{f.sid}</span></div>}
              {f.exit && <div><span className="text-[var(--muted)]">EXIT </span><span className="text-[var(--magenta)]">{f.exit}</span></div>}
              {f.set_crs && <div><span className="text-[var(--muted)]">SET CRS </span>{f.set_crs}</div>}
            </div>
          </Panel>
        )}

        <WeatherPanel icao={data.icao} initialWeather={data.weather} initialNotams={data.notams} initialUpdatedAt={data.wx_updated_at} />

        {data.attachments && data.attachments.length > 0 && (
          <Panel className="p-4 mt-3">
            <Label>Charts &amp; attachments</Label>
            <div className="flex flex-wrap gap-2">
              {data.attachments.map((att,i) => (
                <a key={i} href={`${API.replace('/api','')}/airport-files/${att.relpath}`} target="_blank" rel="noreferrer"
                  className="text-xs bg-[var(--panel-2)] border border-[var(--line)] rounded-md px-2 py-1 text-[var(--cyan)]">
                  {att.filetype.toUpperCase()} · {att.filename.slice(0,10)}…
                </a>
              ))}
            </div>
          </Panel>
        )}

        <button onClick={()=>setShowRaw(s=>!s)} className="text-xs text-[var(--muted)] mt-3 underline">
          {showRaw ? "Hide" : "Show"} original note
        </button>
        {showRaw && (
          <pre className="font-mono text-[11px] whitespace-pre-wrap leading-relaxed text-[var(--text)] border border-[var(--line)] rounded-lg p-3 mt-2 max-h-[40vh] overflow-auto">{data.briefing_md}</pre>
        )}
      </div>
    </div>
  );
}

function AirportsTab() {
  const [airports, setAirports] = useState([]);
  const [form, setForm] = useState({ icao:"", iata:"", name:"", city:"", country:"" });
  const [filter, setFilter] = useState("");
  const [openIcao, setOpenIcao] = useState(null);

  const load = () => fetch(`${API}/airports`).then(r=>r.json()).then(setAirports);
  useEffect(load, []);

  const add = async () => {
    if (!form.icao) return;
    const fd = new FormData();
    Object.entries(form).forEach(([k,v]) => fd.append(k, v));
    await fetch(`${API}/airports`, { method:"POST", body: fd });
    setForm({ icao:"", iata:"", name:"", city:"", country:"" });
    load();
  };

  const shown = airports.filter(a =>
    !filter || a.icao.includes(filter.toUpperCase()) || (a.icao_real||"").includes(filter.toUpperCase())
  );

  return (
    <div className="p-4">
      <Panel className="p-4">
        <Label>Add airport</Label>
        <div className="grid grid-cols-2 gap-2">
          {["icao","iata","name","city","country"].map(f => (
            <input key={f} placeholder={f.toUpperCase()} value={form[f]}
              onChange={e=>setForm({...form,[f]:e.target.value})}
              className="bg-[var(--panel-2)] border border-[var(--line)] rounded-lg p-2 text-sm" />
          ))}
        </div>
        <button onClick={add} className="mt-2 bg-[var(--cyan)] text-[var(--ink)] text-sm font-medium py-2 px-4 rounded-lg">Save</button>
      </Panel>

      <input placeholder="Filter by code (e.g. ABJ, DIAP)…" value={filter} onChange={e=>setFilter(e.target.value)}
        className="w-full bg-[var(--panel-2)] border border-[var(--line)] rounded-lg p-2 text-sm mt-3" />

      <div className="grid md:grid-cols-2 gap-3 mt-3">
        {shown.map(a => (
          <Panel key={a.icao} className="p-4 cursor-pointer hover:border-[var(--cyan)]" onClick={()=>setOpenIcao(a.icao)}>
            <div className="flex justify-between items-center">
              <div>
                <div className="font-mono text-sm">{a.icao} {a.icao_real ? <span className="text-[var(--cyan)]">/ {a.icao_real}</span> : ""}</div>
                <div className="text-xs text-[var(--muted)] mt-1">{a.notes || "Tap to view briefing"}</div>
              </div>
              {a.wx_updated_at && <span className="text-[10px] text-[var(--muted)]">wx {timeAgo(a.wx_updated_at)}</span>}
            </div>
          </Panel>
        ))}
      </div>

      {openIcao && <AirportDetail icao={openIcao} onClose={()=>setOpenIcao(null)} />}
    </div>
  );
}

// ---------- Escape Routes ----------

function EscapeRoutesTab() {
  const [docs, setDocs] = useState([]);
  const [active, setActive] = useState(null);
  const [query, setQuery] = useState("");

  useEffect(() => { fetch(`${API}/references`).then(r=>r.json()).then(setDocs); }, []);
  const open = async (id) => { const res = await fetch(`${API}/references/${id}`); setActive(await res.json()); };

  const blocks = active ? active.body_md.split(/\n(?=[A-Z]{3,6}\s*\n|[A-Z]{3,6}\s*$)/m) : [];
  const filteredBlocks = query ? blocks.filter(b => b.toUpperCase().includes(query.toUpperCase())) : blocks;

  return (
    <div className="p-4 grid md:grid-cols-3 gap-3">
      <Panel className="p-4 md:col-span-1">
        <Label>Reference documents</Label>
        <div className="flex flex-col gap-2">
          {docs.map(d => (
            <button key={d.id} onClick={()=>open(d.id)}
              className={`text-left text-sm px-2 py-2 rounded-lg border ${active && active.id===d.id ? "border-[var(--cyan)] bg-[var(--panel-2)]" : "border-[var(--line)]"}`}>
              {d.title}
              <div className="text-[10px] text-[var(--muted)]">{d.category}</div>
            </button>
          ))}
          {docs.length===0 && <div className="text-sm text-[var(--muted)]">No SID/escape-route docs yet.</div>}
        </div>
      </Panel>

      <Panel className="p-4 md:col-span-2">
        {!active && <div className="text-sm text-[var(--muted)]">Select a document to view exit points and routings.</div>}
        {active && (
          <div>
            <input placeholder="Filter by exit point (e.g. KONET, ALEMU)…" value={query} onChange={e=>setQuery(e.target.value)}
              className="w-full bg-[var(--panel-2)] border border-[var(--line)] rounded-lg p-2 text-sm mb-3" />
            <div className="flex flex-col gap-2 max-h-[70vh] overflow-auto">
              {filteredBlocks.map((b,i) => (
                <pre key={i} className="font-mono text-xs whitespace-pre-wrap leading-relaxed border border-[var(--line)] rounded-lg p-2">{b.trim()}</pre>
              ))}
            </div>
          </div>
        )}
      </Panel>
    </div>
  );
}

// ---------- Bulletins ----------

function BulletinsTab() {
  const [bulletins, setBulletins] = useState([]);
  const [form, setForm] = useState({ title:"", body:"", severity:"info" });
  const load = () => fetch(`${API}/bulletins`).then(r=>r.json()).then(setBulletins);
  useEffect(load, []);

  const create = async () => {
    if (!form.title || !form.body) return;
    const fd = new FormData();
    Object.entries(form).forEach(([k,v]) => fd.append(k, v));
    await fetch(`${API}/bulletins`, { method:"POST", body: fd });
    setForm({ title:"", body:"", severity:"info" });
    load();
  };

  const push = async (id) => { await fetch(`${API}/bulletins/${id}/push`, { method:"POST" }); load(); };

  return (
    <div className="p-4">
      <Panel className="p-4">
        <Label>New bulletin</Label>
        <input placeholder="Title" value={form.title} onChange={e=>setForm({...form,title:e.target.value})}
          className="w-full bg-[var(--panel-2)] border border-[var(--line)] rounded-lg p-2 text-sm mb-2" />
        <textarea placeholder="Body" rows={3} value={form.body} onChange={e=>setForm({...form,body:e.target.value})}
          className="w-full bg-[var(--panel-2)] border border-[var(--line)] rounded-lg p-2 text-sm mb-2" />
        <button onClick={create} className="bg-[var(--panel-2)] border border-[var(--line)] text-sm px-3 py-2 rounded-lg">Save draft</button>
      </Panel>

      <div className="flex flex-col gap-2 mt-3">
        {bulletins.map(b => (
          <Panel key={b.id} className="p-4">
            <div className="flex justify-between items-start">
              <div>
                <div className="font-medium text-sm">{b.title}</div>
                <div className="text-xs text-[var(--muted)] mt-1">{b.body}</div>
                <div className="text-[10px] text-[var(--muted)] mt-1">{b.created_at} {b.pushed ? "· pushed" : ""}</div>
              </div>
              {!b.pushed && (
                <button onClick={()=>push(b.id)} className="text-xs bg-[var(--cyan)] text-[var(--ink)] px-2 py-1 rounded-md">Push</button>
              )}
            </div>
          </Panel>
        ))}
      </div>
    </div>
  );
}

// ---------- Salary ----------

function SalaryTab() {
  const [inp, setInp] = useState({
    base_monthly_salary: 0, guaranteed_block_hours: 75, hourly_rate_above_guarantee: null,
    average_block_hours_flown: 75, per_diem_daily: 0, per_diem_days_per_month: 0,
    other_monthly_allowances: 0, currency: "USD",
  });
  const [result, setResult] = useState(null);

  const calc = async () => {
    const res = await fetch(`${API}/salary`, { method:"POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(inp) });
    setResult(await res.json());
  };

  const field = (key, label) => (
    <div className="mb-2">
      <label className="text-xs text-[var(--muted)]">{label}</label>
      <input type="number" value={inp[key] ?? ""} onChange={e=>setInp({...inp,[key]: e.target.value===""?null:parseFloat(e.target.value)})}
        className="w-full bg-[var(--panel-2)] border border-[var(--line)] rounded-lg p-2 text-sm" />
    </div>
  );

  return (
    <div className="p-4 grid md:grid-cols-2 gap-3">
      <Panel className="p-4">
        {field("base_monthly_salary","Base monthly salary")}
        {field("guaranteed_block_hours","Guaranteed block hours / month")}
        {field("hourly_rate_above_guarantee","Hourly rate above guarantee (optional)")}
        {field("average_block_hours_flown","Average block hours flown / month")}
        {field("per_diem_daily","Per diem (daily)")}
        {field("per_diem_days_per_month","Per diem days / month")}
        {field("other_monthly_allowances","Other monthly allowances")}
        <button onClick={calc} className="mt-1 bg-[var(--cyan)] text-[var(--ink)] text-sm font-medium py-2 w-full rounded-lg">Calculate</button>
      </Panel>
      <Panel className="p-4">
        {!result && <div className="text-sm text-[var(--muted)]">Results appear here.</div>}
        {result && (
          <div className="text-sm space-y-1 font-mono">
            <div>Effective hourly: <b className="text-[var(--cyan)]">{result.effective_hourly_rate} {result.currency}</b></div>
            <div>Extra hours: {result.extra_hours_this_month}</div>
            <div>Extra pay: {result.extra_pay_this_month}</div>
            <div>Per diem (monthly): {result.per_diem_monthly}</div>
            <div>Monthly total: <b>{result.monthly_total}</b></div>
            <div>Annual estimate: <b className="text-[var(--green)]">{result.annual_total_estimate}</b></div>
            <div>Annual block hours: {result.annual_block_hours_estimate}</div>
          </div>
        )}
      </Panel>
    </div>
  );
}

// ---------- error boundary ----------
// Without this, any render error in a tab silently blanks the screen with
// no clue why. This surfaces the actual error text instead.
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.error("Tab crashed:", error, info); }
  render() {
    if (this.state.error) {
      return (
        <div className="p-4">
          <Panel className="p-4 border-[var(--red)]">
            <div className="text-sm text-[var(--red)] font-medium mb-1">This tab hit an error</div>
            <div className="font-mono text-xs text-[var(--muted)] whitespace-pre-wrap">{String(this.state.error && this.state.error.message || this.state.error)}</div>
          </Panel>
        </div>
      );
    }
    return this.props.children;
  }
}

function App() {
  const [tab, setTab] = useState("Overview");
  useEffect(() => { if (tg()) { tg().ready(); tg().expand(); } }, []);

  return (
    <div className="min-h-screen">
      <Header tab={tab} setTab={setTab}/>
      <ErrorBoundary key={tab}>
        {tab==="Overview" && <OverviewTab setTab={setTab}/>}
        {tab==="Ask" && <AskTab/>}
        {tab==="Documents" && <DocumentsTab/>}
        {tab==="Legality" && <LegalityTab/>}
        {tab==="Airports" && <AirportsTab/>}
        {tab==="Escape Routes" && <EscapeRoutesTab/>}
        {tab==="Bulletins" && <BulletinsTab/>}
        {tab==="Salary" && <SalaryTab/>}
      </ErrorBoundary>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
