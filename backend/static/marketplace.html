/* ---------------------------------------------------------
   HELPERS
--------------------------------------------------------- */

function esc(s){
  return String(s ?? "")
    .replace(/[&<>"']/g,c=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[c]));
}

function uid(){

  const qp =
    new URLSearchParams(location.search)
      .get("client_id");

  if(qp){
    return qp;
  }

  const u =
    tg?.initDataUnsafe?.user;

  if(u?.id){
    return "tg:"+u.id;
  }

  let id =
    localStorage.getItem(
      "crew_market_client"
    );

  if(!id){

    id =
      "web:"+
      (
        crypto?.randomUUID
          ? crypto.randomUUID()
          : Date.now()+"-"+Math.random()
      );

    localStorage.setItem(
      "crew_market_client",
      id
    );
  }

  return id;
}

state.clientId = uid();

function timeAgo(x){

  if(!x){
    return "recently";
  }

  const m =
    Math.max(
      0,
      Math.round(
        (Date.now() -
        new Date(x).getTime()) /
        60000
      )
    );

  if(m < 1){
    return "just now";
  }

  if(m < 60){
    return m+"m ago";
  }

  const h =
    Math.round(m/60);

  if(h < 24){
    return h+"h ago";
  }

  return Math.round(h/24)+"d ago";
}

function displayName(p){

  return p.anonymous
    ? "Anonymous crew"
    : (p.poster_name || "Crew member");
}

function currencySummary(p){

  const bits=[];

  if(p.cur_direction){
    bits.push(
      p.cur_direction==="buy"
        ? "BUYING USD"
        : "SELLING USD"
    );
  }

  if(p.cur_amount){
    bits.push(
      Number(p.cur_amount)
        .toLocaleString()+
      " USD"
    );
  }

  if(p.cur_rate){
    bits.push(
      "1 USD = "+
      p.cur_rate+
      " ETB"
    );
  }

  return (
    bits.join(" · ") ||
    p.description ||
    "Open to crew offers"
  );
}

function tripChip(p){

  if(!p.trip_city){
    return "";
  }

  const mode =
    p.trip_mode &&
    p.trip_mode!=="none"
      ? p.trip_mode
      : "";

  return `
    <span class="chip px-2.5 py-1 text-[10px]
      font-semibold text-gray-600">
      ✈ ${esc(p.trip_city)}
      ${p.trip_date
        ? " · "+esc(p.trip_date)
        : ""}
      ${mode
        ? " · "+esc(mode)
        : ""}
    </span>
  `;
}

function visibleItems(){

  return state.view==="mine"
    ? state.items.filter(x=>x.is_owner)
    : state.items;
}

/* ---------------------------------------------------------
   FETCH WITH TIMEOUT
--------------------------------------------------------- */

async function fetchWithTimeout(
  url,
  options={},
  timeout=10000
){

  const controller =
    new AbortController();

  const timer =
    setTimeout(
      ()=>controller.abort(),
      timeout
    );

  try{

    return await fetch(
      url,
      {
        ...options,
        signal:controller.signal
      }
    );

  }finally{

    clearTimeout(timer);
  }
}

/* ---------------------------------------------------------
   RENDER
--------------------------------------------------------- */

function render(){

  const app =
    document.getElementById("app");

  if(!app){
    return;
  }

  app.innerHTML =
    state.view==="chat"
      ? chatPage()
      : homePage();

  if(state.composer){
    document.body.insertAdjacentHTML(
      "beforeend",
      composerModal()
    );
  }

  document.body.classList.toggle(
    "no-scroll",
    !!state.composer
  );
}

  state.composer=false;
  state.submitting=false;

  document
    .getElementById("composer")
    ?.remove();

  document.body.classList.remove(
    "no-scroll"
  );

  render();
}

function setComposerType(t){

  state.composerType=t;

  const panel =
    document.querySelector(
      "#composer .modal-panel"

  if(panel){

    const scroll =
      panel.scrollTop;

    render();

    requestAnimationFrame(()=>{
      document.querySelector(
        "#composer .modal-panel"
      )?.scrollTo(0,scroll);
    });

  }else{

    render();
  }
}

--------------------------------------------------------- */

async function submitListing(e){

  e.preventDefault();

  if(state.submitting){
    return;
  }

  state.submitting=true;

  const btn =
    document.getElementById(
      "publishBtn"
    );

  if(btn){

    btn.disabled=true;

    btn.innerHTML=`
      <span class="inline-flex
        items-center gap-1">

        Publishing

        <span class="loading-dot"></span>
        <span class="loading-dot"></span>
        <span class="loading-dot"></span>

      </span>
    `;
  }

  try{

    const fd =
      new FormData();

    const type =
      state.composerType;

    fd.append(
      "type",
      type
    );

    let title =
      document
        .getElementById("f_title")
        ?.value
        .trim() || "";

    let desc =
      document
        .getElementById("f_description")
        ?.value
        .trim() || "";

    const amazon =
      document
        .getElementById("f_amazon")
        ?.value
        .trim() || "";

    if(amazon){

      desc =
        (
          desc
            ? desc+"\n\n"
            : ""
        )+
        "AMAZON PRODUCT: "+
        amazon;
    }

    /* Never send blank title */

    if(!title){

      title =
        type==="currency"
          ? "USD exchange"
          : type==="trip"
            ? "Layover / flight match"
            : type==="buy"
              ? "Crew item wanted"
              : type==="service"
                ? "Crew service"
                : "Crew item available";
    }

    fd.append(
      "title",
      title
    );

    fd.append(
      "description",
      desc
    );

    fd.append(
      "client_id",
      state.clientId
    );

    fd.append(
      "trip_city",
      document
        .getElementById("f_city")
        ?.value || ""
    );

    fd.append(
      "trip_date",
      document
        .getElementById("f_date")
        ?.value || ""
    );

    fd.append(
      "poster_name",
      document
        .getElementById("f_name")
        ?.value || ""
    );

    fd.append(
      "contact_phone",
      document
        .getElementById("f_phone")
        ?.value || ""
    );

    fd.append(
      "contact_email",
      document
        .getElementById("f_email")
        ?.value || ""
    );

    fd.append(
      "anonymous",
      document
        .getElementById("f_anonymous")
        ?.checked
        ? "true"
        : "false"
    );

    fd.append(
      "item_mode",
      document
        .getElementById("f_item_mode")
        ?.value || "sell"
    );

    fd.append(
      "amazon_url",
      amazon
    );

    if(type==="currency"){

      fd.append(
        "cur_direction",
        document
          .getElementById("f_direction")
          ?.value || "sell"
      );

      fd.append(
        "cur_amount",
        document
          .getElementById("f_amount")
          ?.value || ""
      );

      fd.append(
        "cur_rate",
        document
          .getElementById("f_rate")
          ?.value || ""
      );

      fd.append(
        "cur_open",
        document
          .getElementById("f_open")
          ?.checked
          ? "true"
          : "false"
      );

      fd.append(
        "price_currency",
        "ETB"
      );
    }

    const r =
      await fetchWithTimeout(
        API+"/marketplace/listings",
        {
          method:"POST",
          body:fd
        },
        10000
      );

    const text =
      await r.text();

    let d={};

    try{
      d=JSON.parse(text);
    }catch(_){
      throw new Error(
        "Marketplace returned an invalid response."
      );
    }

    if(!r.ok){

      throw new Error(
        d?.detail ||
        `Unable to publish (${r.status}).`
      );
    }

    state.composer=false;
    state.submitting=false;

    document
      .getElementById("composer")
      ?.remove();

    document.body.classList.remove(
      "no-scroll"
    );

    toast(
      "Posted to Crew Market ✓"
    );

    await loadListings();

  }catch(err){

    state.submitting=false;

    if(err.name==="AbortError"){

      toast(
        "Posting timed out. "+
        "Your listing may not have been saved."
      );

    }else{

      toast(
        err.message ||
        "Unable to publish listing."
      );
    }

    const b =
      document.getElementById(
        "publishBtn"
      );

    if(b){

      b.disabled=false;
      b.textContent=
        "Publish to Crew Market";
    }
  }
}

--------------------------------------------------------- */

let timer=null;

function debouncedLoad(){

  clearTimeout(timer);

  timer =
    setTimeout(
      ()=>loadListings(),
      350
    );
}

async function loadListings(){

  const requestId =
    ++state.requestSeq;

  state.loading=true;

  const loadingLabel =
    document.querySelector(
      "[data-market-loading]"
    );

  if(loadingLabel){
    loadingLabel.textContent=
      "UPDATING…";
  }

  const u =
    new URL(
      API+"/marketplace/listings"
    );

  if(state.view==="mine"){

    u.searchParams.delete("type");

  }else if(state.filter!=="all"){

    u.searchParams.set(
      "type",
      state.filter
    );
  }

  if(state.query.trim()){

    u.searchParams.set(
      "query",
      state.query.trim()
    );
  }

  if(state.city.trim()){

    u.searchParams.set(
      "city",
      state.city.trim()
    );
  }

  u.searchParams.set(
    "client_id",
    state.clientId
  );

  try{

    const r =
      await fetchWithTimeout(
        u.toString(),
        {
          cache:"no-store"
        },
        10000
      );

    const text =
      await r.text();

    let d;

    try{
      d=JSON.parse(text);
    }catch(_){
      throw new Error(
        `Market server returned an invalid response (${r.status}).`
      );
    }

    if(!r.ok){

      throw new Error(
        d?.detail ||
        `Market request failed (${r.status}).`
      );
    }

    if(
      requestId !==
      state.requestSeq
    ){
      return;
    }

    state.items =
      Array.isArray(d)
        ? d
        : [];

  }catch(e){

    if(
      requestId !==
      state.requestSeq
    ){
      return;
    }

    if(e.name==="AbortError"){

      toast(
        "Market request timed out."
      );

    }else{

      toast(
        e.message ||
        "Could not load the market."
      );
    }

  }finally{

    if(
      requestId ===
      state.requestSeq
    ){

      state.loading=false;

      /*
       * Only render the main page.
       * Never let a listing refresh
       * destroy an active chat/sheet.
       */

      if(
        state.view==="home" ||
        state.view==="mine"
      ){

        render();
      }
    }
  }

async function openBids(id){

  const p =
    state.items.find(
      x=>String(x.id)===String(id)
    ) ||
    state.selected;

  if(!p){
    toast("Listing not found.");
    return;
  }

  state.selected=p;
  state.bids=[];
  state.bidLoading=true;

  document
    .getElementById("bidSheet")
    ?.remove();

  document.body.insertAdjacentHTML(
    "beforeend",
    bidSheet()
  );

  try{

    const r =
      await fetchWithTimeout(
        API+
        `/marketplace/listings/${encodeURIComponent(id)}/bids`+
        `?client_id=${encodeURIComponent(state.clientId)}`,
        {
          cache:"no-store"
        },
        10000
      );

    const text =
      await r.text();

    let d={};

    try{
      d=JSON.parse(text);
    }catch(_){
      throw new Error(
        "Invalid bid response."
      );
    }

    if(!r.ok){

      throw new Error(
        d?.detail ||
        `Unable to load bids (${r.status}).`
      );
    }

    state.bids =
      Array.isArray(d)
        ? d
        : [];

  }catch(e){

    if(e.name==="AbortError"){

      toast(
        "Bid request timed out."
      );

    }else{

      toast(
        e.message ||
        "Could not load bids."
      );
    }

  }finally{

    state.bidLoading=false;

    const sheet =
      document.getElementById(
        "bidSheet"
      );

    if(sheet){

      sheet.outerHTML =
        bidSheet();
    }
  }
}

--------------------------------------------------------- */

async function submitBid(e,id){

  e.preventDefault();

  const btn =
    document.getElementById(
      "bidSubmitBtn"
    );

  if(btn){

    btn.disabled=true;
    btn.textContent=
      "Submitting…";
  }

  const fd =
    new FormData();

  fd.append(
    "client_id",
    state.clientId
  );

  fd.append(
    "rate",
    document
      .getElementById("bid_rate")
      ?.value || ""
  );

  fd.append(
    "bidder_name",
    document
      .getElementById("bid_name")
      ?.value || ""
  );

  fd.append(
    "anonymous",
    document
      .getElementById("bid_anonymous")
      ?.checked
      ? "true"
      : "false"
  );

  fd.append(
    "note",
    document
      .getElementById("bid_note")
      ?.value || ""
  );

  fd.append(
    "contact_phone",
    document
      .getElementById("bid_phone")
      ?.value || ""
  );

  fd.append(
    "contact_email",
    document
      .getElementById("bid_email")
      ?.value || ""
  );

  try{

    const r =
      await fetchWithTimeout(
        `${API}/marketplace/listings/${encodeURIComponent(id)}/bids`,
        {
          method:"POST",
          body:fd
        },
        10000
      );

    const text =
      await r.text();

    let d={};

    try{
      d=JSON.parse(text);
    }catch(_){
      throw new Error(
        "Invalid marketplace response."
      );
    }

    if(!r.ok){

      throw new Error(
        d?.detail ||
        "Bid failed."
      );
    }

    closeBidForm();

    document
      .getElementById("bidSheet")
      ?.remove();

    toast(
      "Bid placed successfully ✓"
    );

    await loadListings();

  }catch(e){

    if(e.name==="AbortError"){

      toast(
        "Bid request timed out."
      );

    }else{

      toast(
        e.message ||
        "Bid failed."
      );
    }

    if(btn){

      btn.disabled=false;
      btn.textContent=
        "Submit bid";
    }
  }
}

async function openChat(id){

  const p =
    state.items.find(
      x=>String(x.id)===String(id)
    ) ||
    state.selected;

  if(!p){

    toast(
      "Listing not found."
    );

    return;
  }

  /*
   * Remove blocking sheets BEFORE
   * doing the network request.
   */

  document
    .getElementById("bidSheet")
    ?.remove();

  document
    .getElementById("bidFormSheet")
    ?.remove();

  document
    .getElementById("composer")
    ?.remove();

  state.selected=null;

  toast(
    "Opening chat…"
  );

  try{

    const r =
      await fetchWithTimeout(
        API+
        `/marketplace/listings/${encodeURIComponent(id)}/chat`+
        `?client_id=${encodeURIComponent(state.clientId)}`,
        {
          cache:"no-store"
        },
        10000
      );

    const text =
      await r.text();

    let d={};

    try{
      d=JSON.parse(text);
    }catch(_){
      throw new Error(
        "Invalid chat response."
      );
    }

    if(!r.ok){

      throw new Error(
        d?.detail ||
        `Unable to open chat (${r.status}).`
      );
    }

    state.thread =
      d.is_owner
        ? (
          (d.threads||[])[0] ||
          null
        )
        : d.thread;

    state.chatListing=p;

    if(state.thread){

      state.view="chat";

      render();

    }else{

      toast(
        "No conversation yet."
      );
    }

  }catch(e){

    if(e.name==="AbortError"){

      toast(
        "Chat request timed out."
      );

    }else{

      toast(
        e.message ||
        "Unable to open chat."
      );
    }
  }
}

async function agreeDeal(){

  if(!state.thread){
    return;
  }

  const fd =
    new FormData();

  fd.append(
    "client_id",
    state.clientId
  );

  toast(
    "Updating deal…"
  );

  try{

    const r =
      await fetchWithTimeout(
        `${API}/marketplace/threads/${state.thread.id}/agree`,
        {
          method:"POST",
          body:fd
        },
        10000
      );

    const text =
      await r.text();

    let d={};

    try{
      d=JSON.parse(text);
    }catch(_){
      throw new Error(
        "Invalid agreement response."
      );
    }

    if(!r.ok){

      throw new Error(
        d?.detail ||
        "Could not agree."
      );
    }

    const rr =
      await fetchWithTimeout(
        `${API}/marketplace/threads/${state.thread.id}`+
        `?client_id=${encodeURIComponent(state.clientId)}`,
        {
          cache:"no-store"
        },
        10000
      );

    const txt =
      await rr.text();

    let threadData={};

    try{
      threadData=
        JSON.parse(txt);
    }catch(_){
      throw new Error(
        "Invalid thread response."
      );
    }

    if(!rr.ok){

      throw new Error(
        threadData?.detail ||
        "Could not refresh conversation."
      );
    }

    state.thread=
      threadData;

    render();

    toast(
      "Deal marked agreed ✓"
    );

  }catch(e){

    if(e.name==="AbortError"){

      toast(
        "Agreement request timed out."
      );

    }else{

      toast(
        e.message ||
        "Could not agree."
      );
    }
  }
}

/* ---------------------------------------------------------
   SEND MESSAGE
--------------------------------------------------------- */

async function sendMessage(e){

  e.preventDefault();

  const el =
    document.getElementById(
      "msg"
    );

  const text =
    el?.value.trim();

  if(
    !text ||
    !state.thread
  ){
    return;
  }

  const submit =
    e.submitter;

  if(submit){
    submit.disabled=true;
  }

  const fd =
    new FormData();

  fd.append(
    "client_id",
    state.clientId
  );

  fd.append(
    "text",
    text
  );

  try{

    const r =
      await fetchWithTimeout(
        `${API}/marketplace/threads/${state.thread.id}/messages`,
        {
          method:"POST",
          body:fd
        },
        10000
      );

    if(!r.ok){

      const txt =
        await r.text();

      let d={};

      try{
        d=JSON.parse(txt);
      }catch(_){}

      throw new Error(
        d?.detail ||
        "Message failed."
      );
    }

    const rr =
      await fetchWithTimeout(
        `${API}/marketplace/threads/${state.thread.id}`+
        `?client_id=${encodeURIComponent(state.clientId)}`,
        {
          cache:"no-store"
        },
        10000
      );

    const txt =
      await rr.text();

    let d={};

    try{
      d=JSON.parse(txt);
    }catch(_){
      throw new Error(
        "Invalid message response."
      );
    }

    if(!rr.ok){

      throw new Error(
        d?.detail ||
        "Could not refresh messages."
      );
    }

    state.thread=d;

    render();

    setTimeout(
      ()=>{
        document
          .getElementById("messages")
          ?.scrollTo(
            0,
            99999
          );
      },
      30
    );

  }catch(e){

    if(e.name==="AbortError"){

      toast(
        "Message request timed out."
      );

    }else{

      toast(
        e.message ||
        "Message failed."
      );
    }

    if(submit){
      submit.disabled=false;
    }
  }
}

/* ---------------------------------------------------------
   TOAST
--------------------------------------------------------- */

function toast(text){

  const old =
    document.getElementById(
      "toast"
    );

  if(old){
    old.remove();
  }

  const d =
    document.createElement(
      "div"
    );

  d.id="toast";

  d.className=
    "fixed left-1/2 -translate-x-1/2 "+
    "bottom-20 z-[200] "+
    "bg-gray-950 text-white "+
    "text-xs font-semibold "+
    "px-4 py-3 rounded-xl "+
    "shadow-xl max-w-[90vw] "+
    "text-center";

  d.textContent=text;

  document.body.appendChild(d);

  clearTimeout(
    state.toastTimer
  );

  state.toastTimer =
    setTimeout(
      ()=>{
        d.remove();
      },
      2800
    );
}

/* ---------------------------------------------------------
   GLOBAL ESCAPE / BACK
--------------------------------------------------------- */

document.addEventListener(
  "keydown",
  e=>{

    if(e.key!=="Escape"){
      return;
    }

    if(
      document.getElementById(
        "bidFormSheet"
      )
    ){

      closeBidForm();
      return;
    }

    if(
      document.getElementById(
        "bidSheet"
      )
    ){

      closeBidSheet();
      return;
    }

    if(state.composer){

      closeComposer();
      return;
    }

    if(state.view==="chat"){

      state.view="home";
      state.thread=null;
      state.chatListing=null;

      render();

      loadListings();
    }
  }
);

/* ---------------------------------------------------------
   INITIALIZE
--------------------------------------------------------- */

render();
loadListings();

</script>
