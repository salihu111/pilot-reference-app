<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Crew Market · Pilot Reference</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f6fb;--ink:#17151e;--muted:#777383;--line:#e7e3ed;--card:#fff;--violet:#7357ff;--pink:#ff6b9d;--mint:#c9f5e9;--yellow:#fff0b8;--blue:#dcecff}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",Inter,-apple-system,BlinkMacSystemFont,sans-serif}body{padding-bottom:env(safe-area-inset-bottom)}
.display{font-family:"Space Grotesk",sans-serif}.card{background:rgba(255,255,255,.93);border:1px solid rgba(226,222,235,.95);border-radius:26px;box-shadow:0 14px 40px rgba(48,34,72,.07)}
.soft{background:linear-gradient(135deg,#fff 0%,#f1edff 48%,#fff1f5 100%)}.chip{border:1px solid var(--line);background:#fff;border-radius:999px}.hide{display:none!important}
button,input,textarea,select{font:inherit}input:focus,textarea:focus,select:focus{outline:none;border-color:#a995ff;box-shadow:0 0 0 4px rgba(115,87,255,.1)}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:#d8d3df;border-radius:99px}.fade{animation:fade .22s ease}@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.hero-grid{background-image:radial-gradient(rgba(115,87,255,.13) 1px,transparent 1px);background-size:18px 18px}.nav-shadow{box-shadow:0 -12px 30px rgba(40,30,60,.08)}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:disabled{opacity:.55;pointer-events:none}
</style>
</head>
<body>
<div id="app"></div>
<script>
const API=(window.API_BASE||location.origin+"/api");
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#f7f6fb');tg.setBackgroundColor('#f7f6fb')}catch(e){}}
const state={items:[],filter:'all',query:'',city:'',clientId:'',loading:false,view:'home',composer:false,composerType:'sell',selected:null,bids:[],bidLoading:false,thread:null,chatListing:null,chatLoading:false,toastTimer:null,loadSeq:0};
const filters=[['all','Everything','✦'],['currency','Currency','＄'],['sell','Sell','↗'],['buy','Wanted','⌕'],['trip','Layovers','✈'],['service','Services','✦']];
const itemTypes=[['sell','Sell an item'],['buy','Wanted / need'],['currency','Currency bid board'],['trip','Layover / flight match'],['service','Service / Amazon run']];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function uid(){const qp=new URLSearchParams(location.search).get('client_id');if(qp)return qp;const u=tg?.initDataUnsafe?.user;if(u?.id)return 'tg:'+u.id;let id=localStorage.getItem('crew_market_client');if(!id){id='web:'+crypto.randomUUID();localStorage.setItem('crew_market_client',id)}return id}
state.clientId=uid();
function icon(n,s=20){const p={back:`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>`,plus:`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>`,search:`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>`,chat:`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 11.5a7.5 7.5 0 0 1-8 7.4 8.5 8.5 0 0 1-4.2-1.1L4 19l1.2-3.1A7.4 7.4 0 0 1 4.5 11 7.5 7.5 0 0 1 12 4a7.5 7.5 0 0 1 8 7.5Z"/></svg>`,plane:`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 16h20M5 16l2-7 10-3 3 3-8 3-2 4M9 16l-1 4M16 16l1 4"/></svg>`,close:`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg>`,shield:`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 20 6v6c0 5-3.4 8-8 9-4.6-1-8-4-8-9V6l8-3Z"/><path d="m9 12 2 2 4-4"/></svg>`,bag:`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 8h14l1 12H4L5 8Z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>`,spark:`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 2 1.7 6.3L20 10l-6.3 1.7L12 18l-1.7-6.3L4 10l6.3-1.7L12 2Z"/><path d="m19 16 .8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16Z"/></svg>`};return p[n]||''}
function typeMeta(t){return({sell:['FOR SALE','#e8fbf3','#14845a','bag'],buy:['WANTED','#eaf5ff','#2672b8','search'],currency:['CURRENCY','#fff5d8','#9a6b00','spark'],trip:['LAYOVER MATCH','#eeeaff','#6249d9','plane'],service:['SERVICE','#fff0f5','#c03b69','spark']})[t]||['MARKET','#f2f1f5','#666','spark']}
function timeAgo(x){if(!x)return'recently';const m=Math.max(0,Math.round((Date.now()-new Date(x).getTime())/60000));if(m<1)return'just now';if(m<60)return m+'m ago';const h=Math.round(m/60);if(h<24)return h+'h ago';return Math.round(h/24)+'d ago'}
function displayName(p){return p.anonymous?'Anonymous crew':(p.poster_name||'Crew member')}
function visibleItems(){return state.view==='mine'?state.items.filter(x=>x.is_owner):state.items}
function currencySummary(p){const bits=[];if(p.cur_direction)bits.push(p.cur_direction==='buy'?'BUYING USD':'SELLING USD');if(p.cur_amount)bits.push(Number(p.cur_amount).toLocaleString()+' USD');if(p.cur_rate)bits.push('1 USD = '+p.cur_rate+' ETB');return bits.join(' · ')||p.description||'Open to crew offers'}
function tripChip(p){if(!p.trip_city)return'';const mode=p.trip_mode&&p.trip_mode!=='none'?p.trip_mode:'';return `<span class="chip px-2.5 py-1 text-[10px] font-semibold text-gray-600">✈ ${esc(p.trip_city)}${p.trip_date?' · '+esc(p.trip_date):''}${mode?' · '+esc(mode):''}</span>`}
function render(){document.getElementById('app').innerHTML=state.view==='chat'?chatPage():homePage();if(state.composer)document.body.insertAdjacentHTML('beforeend',composerModal())}
function homePage(){return `<main class="max-w-4xl mx-auto px-4 pt-5 pb-28">
<header class="flex items-center justify-between mb-5"><div><div class="text-[11px] font-bold tracking-[.16em] text-gray-400">PILOT REFERENCE</div><h1 class="display text-[30px] font-bold tracking-tight">${state.view==='mine'?'My Market':'Crew Market'}<span class="text-violet-500">.</span></h1></div><button onclick="openComposer()" class="w-12 h-12 rounded-2xl bg-gray-950 text-white grid place-items-center shadow-lg">${icon('plus',21)}</button></header>
<section class="card soft hero-grid p-5 sm:p-7 mb-4 overflow-hidden"><div class="flex items-start justify-between gap-5"><div class="max-w-2xl"><span class="inline-flex chip px-3 py-1.5 text-[10px] font-bold tracking-wide text-gray-600 mb-3">${icon('plane',13)} BUILT FOR FLIGHT CREW</span><h2 class="display text-[27px] sm:text-[34px] leading-[1.03] font-bold">Your layover network,<br><span class="text-violet-600">now tradable.</span></h2><p class="text-sm text-gray-600 mt-3 max-w-xl">Exchange USD, find crew essentials, match layovers and help each other with orders — without exposing anyone's contact details.</p></div><div class="hidden sm:grid w-20 h-20 rounded-[24px] bg-white/75 place-items-center text-violet-600">${icon('spark',38)}</div></div></section>
<div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-5"><button onclick="state.filter='currency';loadListings()" class="card p-3 text-left hover:-translate-y-0.5 transition"><div class="text-xl">＄</div><div class="font-semibold text-sm mt-1">Currency</div><div class="text-[10px] text-gray-400">Bid board</div></button><button onclick="state.filter='sell';loadListings()" class="card p-3 text-left hover:-translate-y-0.5 transition"><div class="text-xl">↗</div><div class="font-semibold text-sm mt-1">Item board</div><div class="text-[10px] text-gray-400">Sell · swap · free</div></button><button onclick="state.filter='trip';loadListings()" class="card p-3 text-left hover:-translate-y-0.5 transition"><div class="text-xl">✈</div><div class="font-semibold text-sm mt-1">Layovers</div><div class="text-[10px] text-gray-400">Match a trip</div></button><button onclick="state.filter='service';loadListings()" class="card p-3 text-left hover:-translate-y-0.5 transition"><div class="text-xl">📦</div><div class="font-semibold text-sm mt-1">Amazon runs</div><div class="text-[10px] text-gray-400">Crew delivery</div></button></div>
<div class="card p-3 mb-4"><div class="relative"><span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">${icon('search',17)}</span><input id="searchBox" value="${esc(state.query)}" oninput="state.query=this.value;debouncedLoad()" placeholder="Search USD, iPhone, Mumbai, charger…" class="w-full h-11 rounded-xl border border-gray-200 bg-gray-50 pl-10 pr-3 text-sm"></div><div class="mt-2"><input id="cityBox" value="${esc(state.city)}" oninput="state.city=this.value;debouncedLoad()" placeholder="Filter by city / layover (e.g. Mumbai)" class="w-full h-10 rounded-xl border border-gray-200 bg-gray-50 px-3 text-xs"></div><div class="flex gap-2 overflow-x-auto mt-3 pb-1">${filters.map(f=>`<button onclick="state.filter='${f[0]}';loadListings()" class="chip shrink-0 px-3 py-2 text-xs font-semibold ${state.filter===f[0]?'!bg-gray-950 !text-white !border-gray-950':'text-gray-600'}">${f[2]}&nbsp; ${f[1]}</button>`).join('')}</div></div>
${highlightSection()}
<div class="flex items-center justify-between px-1 mb-2"><div class="text-[10px] font-bold tracking-widest text-gray-400">${state.loading?'UPDATING…':state.filter==='currency'?'CURRENCY BID BOARD':state.filter==='sell'||state.filter==='buy'?'ITEM BOARD':state.filter==='trip'?'LAYOVER MATCHING':state.filter==='service'?'CREW SERVICES & AMAZON':'LATEST FROM CREW'}</div><button onclick="loadListings()" class="text-xs font-semibold text-violet-600">Refresh</button></div>
<div class="space-y-3">${visibleItems().length?visibleItems().map(card).join(''):`<div class="card p-10 text-center"><div class="mx-auto w-14 h-14 rounded-2xl bg-violet-50 grid place-items-center text-violet-500">${icon('spark',24)}</div><div class="display font-semibold mt-3">Nothing here yet</div><p class="text-sm text-gray-500 mt-1">Post the first crew request and make the network useful.</p><button onclick="openComposer()" class="mt-4 px-5 py-2.5 rounded-xl bg-gray-950 text-white text-sm font-semibold">Create a post</button></div>`}</div>
</main><nav class="fixed bottom-0 left-0 right-0 z-30 bg-white/90 backdrop-blur border-t border-gray-200 nav-shadow pb-[env(safe-area-inset-bottom)]"><div class="max-w-4xl mx-auto h-16 px-2 sm:px-4 grid grid-cols-4 items-center"><button onclick="state.view='home';state.filter='all';loadListings()" class="h-14 w-full text-violet-600 text-[10px] font-bold flex flex-col items-center justify-center gap-0.5"><span class="text-lg leading-none">✦</span><span>Market</span></button><button onclick="openComposer()" class="justify-self-center -mt-6 w-14 h-14 rounded-full bg-gray-950 text-white grid place-items-center shadow-xl ring-4 ring-white">${icon('plus',23)}</button><button onclick="state.view='home';state.filter='trip';loadListings()" class="h-14 w-full text-gray-400 text-[10px] font-semibold flex flex-col items-center justify-center gap-0.5"><span class="text-lg leading-none">✈</span><span>Trips</span></button><button onclick="state.view='mine';state.filter='all';loadListings()" class="h-14 w-full ${state.view==='mine'?'text-violet-600 font-bold':'text-gray-400'} text-[10px] font-semibold flex flex-col items-center justify-center gap-0.5"><span class="text-lg leading-none">♡</span><span>My Market</span></button></div></nav>`}
function highlightSection(){const live=state.items.filter(x=>x.type==='currency'||x.type==='trip'||x.type==='service').slice(0,3);if(!live.length)return `<section class="mb-5"><div class="flex items-end justify-between mb-2 px-1"><div><div class="text-[10px] font-bold tracking-widest text-violet-500">CREW PICKS</div><h3 class="display text-xl font-bold">Useful on the next trip</h3></div></div><div class="grid sm:grid-cols-3 gap-3"><div class="card p-4 soft"><div class="text-2xl">＄</div><div class="font-semibold mt-3">USD bid board</div><div class="text-xs text-gray-500 mt-1">Name your rate or let crew make offers.</div></div><div class="card p-4"><div class="text-2xl">✈</div><div class="font-semibold mt-3">Layover match</div><div class="text-xs text-gray-500 mt-1">Tag a city and date to get help on route.</div></div><div class="card p-4"><div class="text-2xl">📦</div><div class="font-semibold mt-3">Amazon run</div><div class="text-xs text-gray-500 mt-1">Ask a crew member already flying there.</div></div></div></section>`;return `<section class="mb-5"><div class="flex items-end justify-between mb-2 px-1"><div><div class="text-[10px] font-bold tracking-widest text-violet-500">CREW PICKS</div><h3 class="display text-xl font-bold">Worth a look</h3></div><span class="text-[10px] text-gray-400">Live listings</span></div><div class="grid sm:grid-cols-3 gap-3">${live.map(p=>miniHighlight(p)).join('')}</div></section>`}
function miniHighlight(p){const [lab,bg,fg,ic]=typeMeta(p.type);return `<button onclick="${p.is_demo?'showSampleInfo('+p.id+')':(p.type==='currency'?'openBids('+p.id+')':'openChat('+p.id+')')}" class="card p-4 text-left hover:-translate-y-0.5 transition" style="background:${bg}"><div class="flex justify-between"><span class="text-[9px] font-bold tracking-wide" style="color:${fg}">${lab}</span><span style="color:${fg}">${icon(ic,16)}</span></div><div class="display font-bold mt-3 line-clamp-2">${esc(p.title)}</div><div class="text-xs text-gray-600 mt-1 line-clamp-2">${esc(p.type==='currency'?currencySummary(p):(p.description||p.trip_city||''))}</div></button>`}
function card(p){const [lab,bg,fg,ic]=typeMeta(p.type);const who=displayName(p);let detail=p.type==='currency'?currencySummary(p):(p.description||'No description provided.');let price='';if(p.price_amount)price=`<div class="rounded-xl bg-gray-50 px-3 py-2.5"><div class="text-[9px] uppercase tracking-wide text-gray-400">Price</div><div class="font-bold text-sm">${esc(p.price_amount)} ${esc(p.price_currency||'')}</div></div>`;const bid=`${p.bid_count||0} bid${Number(p.bid_count)===1?'':'s'}`;return `<article class="card p-4 fade"><div class="flex gap-3"><div class="w-12 h-12 rounded-2xl shrink-0 grid place-items-center" style="background:${bg};color:${fg}">${icon(ic,21)}</div><div class="min-w-0 flex-1"><div class="flex flex-wrap items-center gap-2"><span class="px-2 py-1 rounded-full text-[9px] font-bold tracking-wide" style="background:${bg};color:${fg}">${lab}</span>${p.is_demo?'<span class="px-2 py-1 rounded-full text-[9px] font-bold tracking-wide bg-gray-100 text-gray-500">SAMPLE</span>':''}${p.type!=='currency'&&p.item_mode&&p.type!=='trip'?`<span class="chip px-2.5 py-1 text-[10px] font-semibold text-gray-600">${esc(p.item_mode==='swap'?'TRADE / SWAP':p.item_mode==='free'?'FREE / PAY-IT-FORWARD':'SELL')}</span>`:''}${tripChip(p)}${p.type==='currency'&&p.cur_open?'<span class="text-[9px] font-bold text-violet-600">OPEN TO OFFERS</span>':''}</div><h3 class="display text-[17px] leading-tight font-bold mt-2">${esc(p.title)}</h3><div class="text-sm text-gray-600 mt-1 line-clamp-3">${esc(detail)}</div>${p.amazon_url?`<a href="${esc(p.amazon_url)}" target="_blank" rel="noopener" class="inline-flex mt-2 text-[11px] font-bold text-violet-600">📦 View Amazon product</a>`:''}<div class="flex flex-wrap items-center gap-2 mt-3"><span class="text-[11px] text-gray-400">${esc(who)}</span><span class="text-gray-300">·</span><span class="text-[11px] text-gray-400">${esc(timeAgo(p.created_at))}</span>${p.type==='currency'?`<span class="text-gray-300">·</span><span class="text-[11px] font-semibold text-violet-600">${bid}</span>`:''}</div></div></div><div class="flex gap-2 mt-4">${price}<button onclick="${p.is_demo?'showSampleInfo('+p.id+')':(p.type==='currency'?'openBids('+p.id+')':'openChat('+p.id+')')}" class="flex-1 min-h-[42px] rounded-xl ${p.is_demo?'bg-gray-100 text-gray-700':'bg-gray-950 text-white'} text-sm font-bold flex items-center justify-center gap-2">${p.is_demo?'See example':(p.type==='currency'?'<span>View bids</span>':' '+icon('chat',15)+' Chat')}</button></div></article>`}
function showSampleInfo(id){const p=state.items.find(x=>x.id===id);if(!p)return;toast('Sample post — use + to create your own listing.')}
function composerModal(){return `<div id="composer" class="fixed inset-0 z-50 bg-black/45 backdrop-blur-sm flex items-end sm:items-center justify-center" onclick="if(event.target===this)closeComposer()"><div class="bg-white w-full sm:max-w-xl max-h-[94vh] overflow-auto rounded-t-[30px] sm:rounded-[30px] p-5 pb-[calc(20px+env(safe-area-inset-bottom))]"><div class="flex justify-between items-start mb-4"><div><div class="text-[10px] font-bold tracking-widest text-violet-500">POST TO CREW</div><h2 class="display text-2xl font-bold">What are you looking for?</h2></div><button onclick="closeComposer()" class="w-9 h-9 rounded-xl bg-gray-100 grid place-items-center">${icon('close',17)}</button></div><div class="grid grid-cols-2 gap-2 mb-4">${itemTypes.map(t=>`<button onclick="setComposerType('${t[0]}')" class="p-3 rounded-2xl border text-left ${state.composerType===t[0]?'border-violet-500 bg-violet-50':'border-gray-200 bg-gray-50'}"><div class="text-xs font-bold">${t[1]}</div></button>`).join('')}</div><form onsubmit="submitListing(event)" class="space-y-3"><input id="f_title" maxlength="180" placeholder="Title (optional) · e.g. USD cash available in Addis" class="w-full h-12 rounded-xl border border-gray-200 bg-gray-50 px-3 text-sm"><textarea id="f_description" rows="3" maxlength="4000" placeholder="Details, condition, handover, what you need…" class="w-full rounded-xl border border-gray-200 bg-gray-50 p-3 text-sm"></textarea>${composerSpecific()}<div class="grid grid-cols-2 gap-3"><input id="f_city" placeholder="Layover city / destination" class="w-full h-12 rounded-xl border border-gray-200 bg-gray-50 px-3 text-sm"><input id="f_date" placeholder="Needed by / layover date" class="w-full h-12 rounded-xl border border-gray-200 bg-gray-50 px-3 text-sm"></div><input id="f_name" maxlength="120" placeholder="Public name (optional)" class="w-full h-12 rounded-xl border border-gray-200 bg-gray-50 px-3 text-sm"><div class="grid grid-cols-2 gap-3"><input id="f_phone" maxlength="80" placeholder="Phone — private" class="w-full h-12 rounded-xl border border-gray-200 bg-gray-50 px-3 text-sm"><input id="f_email" maxlength="180" type="email" placeholder="Email — private" class="w-full h-12 rounded-xl border border-gray-200 bg-gray-50 px-3 text-sm"></div><label class="flex items-start gap-3 p-3 rounded-2xl bg-gray-50 border border-gray-200"><input id="f_anonymous" type="checkbox" class="mt-1 w-4 h-4"><span><b class="text-sm">Post anonymously</b><span class="block text-[11px] text-gray-500">Your public name becomes “Anonymous crew”. Contact details remain locked.</span></span></label><div class="flex items-start gap-2 text-[11px] text-gray-500">${icon('shield',16)}<span>Phone and email are never shown on a listing. They are revealed only inside a chat after <b>Mark deal agreed</b>.</span></div><button class="w-full h-12 rounded-2xl bg-gray-950 text-white text-sm font-bold">Publish to Crew Market</button></form></div></div>`}
function composerSpecific(){if(state.composerType==='currency')return `<div class="rounded-2xl bg-amber-50 border border-amber-100 p-3"><div class="text-xs font-bold text-amber-800 mb-2">Currency Bid Board</div><div class="grid grid-cols-2 gap-2"><select id="f_direction" class="h-11 rounded-xl border border-amber-200 bg-white px-3 text-sm"><option value="sell">Selling USD</option><option value="buy">Buying USD</option></select><input id="f_amount" type="number" step="0.01" placeholder="USD amount" class="h-11 rounded-xl border border-amber-200 bg-white px-3 text-sm"></div><div class="grid grid-cols-2 gap-2 mt-2"><input id="f_rate" type="number" step="0.01" placeholder="Named rate · ETB/USD" class="h-11 rounded-xl border border-amber-200 bg-white px-3 text-sm"><label class="flex items-center gap-2 rounded-xl bg-white border border-amber-200 px-3 text-xs"><input id="f_open" type="checkbox" class="w-4 h-4"> Open to offers</label></div></div>`;if(state.composerType==='service')return `<div class="rounded-2xl bg-violet-50 border border-violet-100 p-3"><div class="text-xs font-bold text-violet-800 mb-2">Crew service / Amazon order</div><input id="f_amazon" type="url" placeholder="Amazon product link (optional)" class="w-full h-11 rounded-xl border border-violet-200 bg-white px-3 text-sm"><div class="text-[10px] text-violet-600 mt-2">Post the product link and a crew member can volunteer to bring it on their next flight.</div></div>`;if(state.composerType==='trip')return `<div class="rounded-2xl bg-violet-50 border border-violet-100 p-3 text-xs text-violet-800">Tag the destination and date below. Example: <b>anyone with layover Mumbai (BOM) · Sept 10</b>. Say what you can carry or what you need delivered.</div>`;return `<div class="rounded-2xl bg-gray-50 border border-gray-200 p-3"><div class="text-xs font-bold text-gray-700 mb-2">Item board</div><select id="f_item_mode" class="w-full h-11 rounded-xl border border-gray-200 bg-white px-3 text-sm"><option value="sell">Sell</option><option value="swap">Trade / Swap</option><option value="free">Free / Pay-it-forward</option></select></div>`}
function setComposerType(t){state.composerType=t;render()}
function openComposer(){state.composer=true;state.composerType='sell';render()}
function closeComposer(){state.composer=false;render()}
async function apiFetch(url,options={},timeoutMs=10000){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeoutMs);
  try{return await fetch(url,{...options,signal:controller.signal,cache:options.cache||'no-store'});}
  catch(e){if(e?.name==='AbortError')throw Error('The market server took too long to respond. Please try again.');throw e;}
  finally{clearTimeout(timer);}
}
let timer;function debouncedLoad(){clearTimeout(timer);timer=setTimeout(loadListings,350)}
async function loadListings(){const seq=++state.loadSeq;state.loading=true;render();const u=new URL(API+'/marketplace/listings');if(state.view==='mine'){u.searchParams.delete('type')}else if(state.filter!=='all')u.searchParams.set('type',state.filter);if(state.query.trim())u.searchParams.set('query',state.query.trim());if(state.city.trim())u.searchParams.set('city',state.city.trim());u.searchParams.set('client_id',state.clientId);try{const r=await apiFetch(u,{},9000);const text=await r.text();let d;try{d=JSON.parse(text)}catch(_){throw Error('Market server returned an invalid response ('+r.status+').')}if(!r.ok)throw Error(d?.detail||'Market request failed ('+r.status+').');if(seq===state.loadSeq)state.items=Array.isArray(d)?d:[]}catch(e){if(seq===state.loadSeq){toast(e.message||'Could not load the market.');}}finally{if(seq===state.loadSeq){state.loading=false;render()}}}
async function submitListing(e){e.preventDefault();const fd=new FormData();const type=state.composerType;fd.append('type',type);let title=document.getElementById('f_title').value.trim();let desc=document.getElementById('f_description').value.trim();const amazon=document.getElementById('f_amazon')?.value.trim();if(amazon)desc=(desc?desc+'\n\n':'')+'AMAZON PRODUCT: '+amazon;if(!title){title=type==='currency'?'USD exchange':type==='trip'?'Layover / flight match':type==='buy'?'Crew item wanted':type==='service'?'Crew service':'Crew item available';}fd.append('title',title);fd.append('description',desc);fd.append('client_id',state.clientId);fd.append('trip_city',document.getElementById('f_city').value);fd.append('trip_date',document.getElementById('f_date').value);fd.append('poster_name',document.getElementById('f_name').value);fd.append('contact_phone',document.getElementById('f_phone').value);fd.append('contact_email',document.getElementById('f_email').value);fd.append('anonymous',document.getElementById('f_anonymous').checked);fd.append('item_mode',document.getElementById('f_item_mode')?.value||'sell');fd.append('amazon_url',amazon||'');if(type==='currency'){fd.append('cur_direction',document.getElementById('f_direction').value);fd.append('cur_amount',document.getElementById('f_amount').value);fd.append('cur_rate',document.getElementById('f_rate').value);fd.append('cur_open',document.getElementById('f_open').checked);fd.append('price_currency','ETB')}try{const r=await apiFetch(API+'/marketplace/listings',{method:'POST',body:fd},12000);const d=await r.json();if(!r.ok)throw Error(d.detail||'Unable to publish');state.composer=false;toast('Posted to Crew Market.');await loadListings()}catch(err){toast(err.message)}}
async function openBids(id){
  state.selected=state.items.find(x=>x.id===id)||null;
  state.bids=[];
  state.bidLoading=true;
  render();
  showBidSheet();
  try{
    const r=await apiFetch(`${API}/marketplace/listings/${id}/bids?client_id=${encodeURIComponent(state.clientId)}`,{},9000);
    const text=await r.text();
    let d;try{d=JSON.parse(text)}catch(_){throw Error('Invalid response from the bids service.');}
    if(!r.ok)throw Error(d?.detail||'Could not load bids.');
    state.bids=Array.isArray(d)?d:[];
  }catch(e){
    state.bids=[];
    toast(e.message||'Could not load bids.');
  }finally{
    state.bidLoading=false;
    document.getElementById('bidSheet')?.remove();
    showBidSheet();
  }
}
function showBidSheet(){document.body.insertAdjacentHTML('beforeend',bidSheet());}
function bidSheet(){const p=state.selected||{};const sorted=[...state.bids].sort((a,b)=>Number(b.rate)-Number(a.rate));const owner=!!p.is_owner;const closed=p.status==='closed'||p.status==='archived';return `<div id="bidSheet" class="fixed inset-0 z-[60] bg-black/45 backdrop-blur-sm flex items-end sm:items-center justify-center" onclick="if(event.target===this)closeBidSheet()"><div class="bg-white w-full sm:max-w-xl max-h-[90vh] overflow-auto rounded-t-[30px] sm:rounded-[30px] p-5"><div class="flex justify-between items-start"><div><div class="text-[10px] font-bold tracking-widest text-violet-500">${p.type==='currency'?'CURRENCY BID BOARD':'CREW REQUEST'}</div><h2 class="display text-2xl font-bold">${esc(p.title)}</h2><p class="text-sm text-gray-500 mt-1">${esc(currencySummary(p))}</p></div><button onclick="closeBidSheet()" class="w-9 h-9 rounded-xl bg-gray-100 grid place-items-center">${icon('close',17)}</button></div>${closed?'<div class="mt-4 rounded-2xl bg-gray-100 p-3 text-xs font-semibold text-gray-600">🔒 This bid board is closed. No new bids can be placed.</div>':''}<div class="mt-5 flex items-center justify-between"><span class="text-xs font-bold text-gray-400 tracking-widest">BEST RATE FIRST</span><span class="text-xs text-gray-400">${sorted.length} bid${sorted.length===1?'':'s'}</span></div><div class="space-y-2 mt-2">${state.bidLoading?'<div class="p-8 text-center text-sm text-gray-500">Loading bids…</div>':sorted.length?sorted.map(b=>bidRow(b,p)).join(''):'<div class="p-7 rounded-2xl bg-gray-50 text-center"><div class="display font-semibold">No bids yet</div><div class="text-xs text-gray-500 mt-1">Be the first crew member to make an offer.</div></div>'}</div><div class="grid ${owner?'grid-cols-2':'grid-cols-1'} gap-2 mt-4">${!closed?`<button onclick="placeBidPrompt(${p.id})" class="h-12 rounded-2xl bg-gray-950 text-white font-bold text-sm">Place a bid</button>`:''}<button onclick="closeBidSheet()" class="h-12 rounded-2xl border border-gray-200 font-bold text-sm flex items-center justify-center gap-2">${icon('close',16)} Close</button></div>${owner&&!closed?`<div class="grid grid-cols-2 gap-2 mt-2"><button onclick="closeBidBoard(${p.id})" class="h-10 rounded-xl bg-amber-50 text-amber-800 text-xs font-bold">🔒 Close bidding</button><button onclick="archivePost(${p.id})" class="h-10 rounded-xl bg-gray-100 text-gray-700 text-xs font-bold">🗃 Archive</button></div>`:''}${owner&&closed?`<button onclick="archivePost(${p.id})" class="w-full mt-2 h-10 rounded-xl bg-gray-100 text-gray-700 text-xs font-bold">🗃 Archive post</button>`:''}</div></div>`}
function bidRow(b,p){const name=b.anonymous?'Anonymous crew':(b.bidder_name||'Crew member');return `<div class="rounded-2xl border border-gray-200 p-3"><div class="flex items-center justify-between gap-3"><div><div class="font-bold text-sm">${esc(name)}</div><div class="text-[11px] text-gray-500 mt-1">${esc(b.note||'Crew offer')}</div></div><div class="text-right"><div class="display font-bold text-lg">${esc(b.rate)} ETB</div><div class="text-[9px] text-gray-400">per USD</div></div></div><div class="flex gap-2 mt-3">${b.bidder_client_id?`<button onclick='openBidChat(${p.id},${JSON.stringify(b.bidder_client_id)})' class="flex-1 h-9 rounded-xl bg-gray-950 text-white text-xs font-bold">Chat</button>`:''}<button onclick="placeBidPrompt(${p.id})" class="h-9 px-3 rounded-xl bg-violet-50 text-violet-700 text-xs font-bold">Place a bid</button></div></div>`}
async function placeBidPrompt(id){const rate=prompt('Your rate in ETB per USD:');if(!rate)return;if(!Number.isFinite(Number(rate))||Number(rate)<=0){toast('Enter a valid positive rate.');return;}const note=prompt('Short note (optional):')||'';const name=prompt('Public name (leave blank for Anonymous crew):')||'';const anonymous=!name;const phone=prompt('Phone (optional, revealed only after deal agreement):')||'';const email=prompt('Email (optional, revealed only after deal agreement):')||'';const fd=new FormData();fd.append('client_id',state.clientId);fd.append('rate',rate);fd.append('bidder_name',name);fd.append('anonymous',anonymous);fd.append('note',note);fd.append('contact_phone',phone);fd.append('contact_email',email);try{const r=await apiFetch(`${API}/marketplace/listings/${id}/bids`,{method:'POST',body:fd},12000);const d=await r.json();if(!r.ok)throw Error(d.detail||'Bid failed');toast('Bid placed — bid board stays open.');await openBids(id)}catch(e){toast(e.message)}}
async function closeBidBoard(id){if(!confirm('Close this currency bid board? New bids will no longer be accepted.'))return;const fd=new FormData();fd.append('client_id',state.clientId);try{const r=await apiFetch(`${API}/marketplace/listings/${id}/close`,{method:'POST',body:fd},12000);const d=await r.json();if(!r.ok)throw Error(d.detail||'Could not close bidding');toast('Bid board closed.');closeBidSheet();await loadListings()}catch(e){toast(e.message||'Could not close bidding')}}
async function archivePost(id){if(!confirm('Archive this post? It will no longer appear in the public market.'))return;const fd=new FormData();fd.append('client_id',state.clientId);try{const r=await apiFetch(`${API}/marketplace/listings/${id}/archive`,{method:'POST',body:fd},12000);const d=await r.json();if(!r.ok)throw Error(d.detail||'Could not archive post');toast('Post archived.');closeBidSheet();await loadListings()}catch(e){toast(e.message||'Could not archive post')}}
function closeBidSheet(){document.getElementById('bidSheet')?.remove()}
async function openBidChat(listingId,counterpart){
  toast('Opening chat…');
  try{
    const r=await apiFetch(`${API}/marketplace/listings/${listingId}/thread-with?client_id=${encodeURIComponent(state.clientId)}&counterpart_client_id=${encodeURIComponent(counterpart)}`,{},9000);
    const d=await r.json();
    if(!r.ok)throw Error(d.detail||'Unable to open chat');
    state.thread=d;
    state.chatListing=state.selected||state.items.find(x=>x.id===listingId);
    state.view='chat';
    render();
  }catch(e){toast(e.message||'Unable to open chat');}
}
async function openChat(id){
  const p=state.items.find(x=>x.id===id)||state.selected;
  state.chatListing=p;
  state.thread=null;
  state.chatLoading=true;
  state.view='chat';
  render();
  toast('Opening chat…');
  try{
    const r=await apiFetch(`${API}/marketplace/listings/${id}/chat?client_id=${encodeURIComponent(state.clientId)}`,{},9000);
    const d=await r.json();
    if(!r.ok)throw Error(d.detail||'Unable to open chat');
    state.thread=d.is_owner?((d.threads||[])[0]||null):d.thread;
    if(!state.thread && !d.is_owner)throw Error('Could not create the conversation.');
  }catch(e){
    state.thread=null;
    toast(e.message||'Unable to open chat');
  }finally{
    state.chatLoading=false;
    if(state.view==='chat')render();
  }
}
function chatPage(){const t=state.thread,p=state.chatListing||{};const agreed=!!t?.deal_agreed;return `<main class="max-w-2xl mx-auto min-h-screen flex flex-col"><header class="sticky top-0 z-20 bg-[rgba(247,246,251,.94)] backdrop-blur px-4 pt-4 pb-3 border-b border-gray-200"><div class="flex items-center gap-3"><button onclick="state.view='home';state.thread=null;loadListings()" class="w-10 h-10 rounded-xl bg-white border border-gray-200 grid place-items-center">${icon('back',18)}</button><div class="min-w-0 flex-1"><div class="display font-bold truncate">${esc(p.title||'Crew Market')}</div><div class="text-[10px] text-gray-500">${esc(t?.other_display_name||'Crew member')} · ${agreed?'contact unlocked':'contact locked'}</div></div>${agreed?'<span class="chip px-2.5 py-1 text-[10px] font-bold text-emerald-700">DEAL AGREED</span>':''}</div></header><section class="mx-4 mt-3 card p-3 flex gap-3 items-start">${icon('shield',18)}<div class="text-xs text-gray-600"><b>Privacy gate.</b> Phone/email stay hidden. Only this thread can reveal contact details after the deal is agreed.</div></section><main id="messages" class="flex-1 px-4 py-5 space-y-2">${(t?.messages||[]).map(m=>`<div class="flex ${m.sender_client_id===state.clientId?'justify-end':''}"><div class="max-w-[82%] rounded-2xl px-3.5 py-2.5 ${m.sender_client_id===state.clientId?'bg-gray-950 text-white':'bg-white border border-gray-200'}"><div class="text-sm whitespace-pre-wrap">${esc(m.text)}</div><div class="text-[9px] opacity-50 mt-1">${esc(timeAgo(m.created_at))}</div></div></div>`).join('')}${!(t?.messages||[]).length?'<div class="text-center text-sm text-gray-500 py-16">Start the conversation. Keep payment and handover details inside the chat.</div>':''}</main>${state.chatLoading?'<div class="mx-4 mb-2 rounded-2xl bg-violet-50 border border-violet-100 p-3 text-center text-xs text-violet-700">Opening conversation… You can still use Back at any time.</div>':(t?(agreed?contactReveal(t,p):`<div class="px-4 pb-2"><button onclick="agreeDeal()" class="w-full h-11 rounded-2xl bg-emerald-600 text-white text-sm font-bold">✓ Mark deal agreed</button></div>`):'')}<form onsubmit="sendMessage(event)" class="sticky bottom-0 bg-[rgba(247,246,251,.96)] backdrop-blur p-3 pb-[calc(12px+env(safe-area-inset-bottom))]"><div class="flex gap-2 bg-white border border-gray-200 rounded-2xl p-2"><input id="msg" autocomplete="off" placeholder="Message crew member…" class="flex-1 px-2 text-sm outline-none"><button class="w-10 h-10 rounded-xl bg-gray-950 text-white grid place-items-center">${icon('chat',16)}</button></div></form></main>`}
function contactReveal(t,p){const phone=t?.contact_phone;const email=t?.contact_email;return `<div class="mx-4 mb-2 rounded-2xl border border-emerald-200 bg-emerald-50 p-3"><div class="text-xs font-bold text-emerald-800">✓ Contact unlocked for this agreed deal</div><div class="mt-2 space-y-1 text-sm text-emerald-900">${phone?`<div>📞 ${esc(phone)}</div>`:''}${email?`<div>✉️ ${esc(email)}</div>`:''}${!phone&&!email?'<div class="text-xs text-emerald-700">No contact details were provided.</div>':''}</div></div>`}
async function agreeDeal(){if(!state.thread)return;const fd=new FormData();fd.append('client_id',state.clientId);try{const r=await apiFetch(`${API}/marketplace/threads/${state.thread.id}/agree`,{method:'POST',body:fd},12000);const d=await r.json();if(!r.ok)throw Error(d.detail||'Could not agree');const rr=await apiFetch(`${API}/marketplace/threads/${state.thread.id}?client_id=${encodeURIComponent(state.clientId)}`,{},9000);state.thread=await rr.json();render();toast('Deal agreed — contact details unlocked below.')}catch(e){toast(e.message)}}
async function sendMessage(e){e.preventDefault();const el=document.getElementById('msg');const text=el?.value.trim();if(!text||!state.thread)return;const fd=new FormData();fd.append('client_id',state.clientId);fd.append('text',text);try{const r=await apiFetch(`${API}/marketplace/threads/${state.thread.id}/messages`,{method:'POST',body:fd},12000);if(!r.ok)throw Error();const rr=await apiFetch(`${API}/marketplace/threads/${state.thread.id}?client_id=${encodeURIComponent(state.clientId)}`,{},9000);state.thread=await rr.json();render();setTimeout(()=>document.getElementById('messages')?.scrollTo(0,99999),30)}catch(e){toast('Message failed.')}}
function toast(text){const old=document.getElementById('toast');if(old)old.remove();const d=document.createElement('div');d.id='toast';d.className='fixed left-1/2 -translate-x-1/2 bottom-20 z-[100] bg-gray-950 text-white text-xs font-semibold px-4 py-3 rounded-xl shadow-xl';d.textContent=text;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
render();loadListings();
</script>
</body>
</html>
