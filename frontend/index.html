<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pilot Reference</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background:#0b0f14; color:#e6edf3; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  ::-webkit-scrollbar { width:6px; } ::-webkit-scrollbar-thumb { background:#2a3441; border-radius:3px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">

const { useState, useEffect } = React;

// ---- Configure this to your deployed backend URL ----
const API = window.API_BASE || "https://YOUR-BACKEND.up.railway.app/api";

function tg() { return window.Telegram ? window.Telegram.WebApp : null; }

function Nav({ tab, setTab }) {
  const tabs = ["Ask", "Documents", "Legality", "Airports", "Escape Routes", "Bulletins", "Salary"];
  return (
    <div className="flex gap-1 overflow-x-auto border-b border-[#1c232c] px-2 py-2 bg-[#0e141b] sticky top-0 z-10">
      {tabs.map(t => (
        <button key={t} onClick={() => setTab(t)}
          className={`px-3 py-1.5 rounded-full text-sm whitespace-nowrap transition ${tab===t ? "bg-[#3b82f6] text-white" : "bg-[#1c232c] text-[#9aa7b3]"}`}>
          {t}
        </button>
      ))}
    </div>
  );
}

function Card({ children, className="" }) {
  return <div className={`bg-[#111820] border border-[#1c232c] rounded-xl p-4 ${className}`}>{children}</div>;
}

function AskTab() {
  const [docs, setDocs] = useState([]);
  const [selected, setSelected] = useState([]); // doc ids, empty = all
  const [query, setQuery] = useState("");
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);
  const [activeCitation, setActiveCitation] = useState(null);

  useEffect(() => { fetch(`${API}/documents`).then(r=>r.json()).then(setDocs); }, []);

  const toggleDoc = (id) => {
    setSelected(s => s.includes(id) ? s.filter(x=>x!==id) : [...s, id]);
  };

  const ask = async () => {
    if (!query.trim()) return;
    setLoading(true); setResult(null);
    const form = new FormData();
    form.append("query", query);
    if (selected.length) form.append("doc_ids", selected.join(","));
    try {
      const res = await fetch(`${API}/ask`, { method: "POST", body: form });
      setResult(await res.json());
    } catch (e) { setResult({ answer: "Request failed: " + e.message, citations: [] }); }
    setLoading(false);
  };

  return (
    <div className="grid md:grid-cols-2 gap-3 p-3">
      <Card>
        <div className="text-xs uppercase tracking-wide text-[#6b7885] mb-2">Search scope</div>
        <div className="flex flex-wrap gap-2 mb-3">
          {docs.map(d => (
            <button key={d.id} onClick={()=>toggleDoc(d.id)}
              className={`text-xs px-2 py-1 rounded-md border ${selected.includes(d.id) ? "border-[#3b82f6] bg-[#12233d] text-[#8fb8ff]" : "border-[#1c232c] text-[#6b7885]"}`}>
              {d.title || d.filename}
            </button>
          ))}
          {docs.length===0 && <div className="text-sm text-[#6b7885]">Upload PDFs in the Documents tab first.</div>}
        </div>
        <div className="text-[10px] text-[#6b7885] mb-3">
          {selected.length===0 ? "Searching across ALL uploaded documents." : `Searching ${selected.length} selected document(s).`}
        </div>
        <textarea value={query} onChange={e=>setQuery(e.target.value)} rows={3}
          placeholder="e.g. What is the MEL dispatch limit for the APU?"
          className="w-full bg-[#0b0f14] border border-[#1c232c] rounded-lg p-2 text-sm outline-none focus:border-[#3b82f6]" />
        <button onClick={ask} disabled={loading}
          className="mt-2 w-full bg-[#3b82f6] hover:bg-[#2563eb] text-white text-sm font-medium py-2 rounded-lg disabled:opacity-50">
          {loading ? "Searching…" : "Ask"}
        </button>
      </Card>

      <Card>
        <div className="text-xs uppercase tracking-wide text-[#6b7885] mb-2">Answer</div>
        {!result && <div className="text-sm text-[#6b7885]">Answer and page citations will appear here.</div>}
        {result && (
          <div>
            <div className="text-sm whitespace-pre-wrap leading-relaxed mb-3">{result.answer}</div>
            <div className="text-xs uppercase tracking-wide text-[#6b7885] mb-1">Citations</div>
            <div className="flex flex-col gap-2">
              {result.citations && result.citations.map((c,i) => (
                <button key={i} onClick={()=>setActiveCitation(c)}
                  className="text-left text-xs border border-[#1c232c] rounded-lg p-2 hover:border-[#3b82f6]">
                  <div className="font-medium text-[#8fb8ff]">{c.title} — p.{c.page}</div>
                  <div className="text-[#9aa7b3] mt-1 line-clamp-2">{c.excerpt}</div>
                </button>
              ))}
            </div>
          </div>
        )}
        {activeCitation && (
          <div className="mt-3 border-t border-[#1c232c] pt-3">
            <div className="text-xs uppercase tracking-wide text-[#6b7885] mb-2">
              Page {activeCitation.page} preview
            </div>
            <img
              src={`${API}/documents/${activeCitation.doc_id}/page/${activeCitation.page}/screenshot?highlight=${encodeURIComponent(activeCitation.excerpt.slice(0,60))}`}
              className="w-full rounded-lg border border-[#1c232c]" />
          </div>
        )}
      </Card>
    </div>
  );
}

function DocumentsTab() {
  const [docs, setDocs] = useState([]);
  const [uploading, setUploading] = useState(false);
  const load = () => fetch(`${API}/documents`).then(r=>r.json()).then(setDocs);
  useEffect(load, []);

  const onFile = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setUploading(true);
    const form = new FormData();
    form.append("file", file);
    form.append("title", file.name.replace(/\.pdf$/i,""));
    await fetch(`${API}/documents/upload`, { method:"POST", body: form });
    setUploading(false);
    load();
  };

  return (
    <div className="p-3">
      <Card>
        <div className="text-sm mb-2">Upload a PDF (FOM, FCOM, QRH, DDG, FRM, etc.) — it gets embedded and indexed for search across all tabs.</div>
        <input type="file" accept="application/pdf" onChange={onFile} className="text-sm" />
        {uploading && <div className="text-xs text-[#6b7885] mt-2">Indexing… this can take a minute for large manuals.</div>}
      </Card>
      <div className="grid md:grid-cols-2 gap-3 mt-3">
        {docs.map(d => (
          <Card key={d.id}>
            <div className="font-medium text-sm">{d.title}</div>
            <div className="text-xs text-[#6b7885] mt-1">{d.num_pages} pages · uploaded {d.uploaded_at}</div>
          </Card>
        ))}
      </div>
    </div>
  );
}

function LegalityTab() {
  const [desc, setDesc] = useState("");
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);

  const check = async () => {
    if (!desc.trim()) return;
    setLoading(true); setResult(null);
    const form = new FormData();
    form.append("duty_description", desc);
    const res = await fetch(`${API}/legal-check`, { method:"POST", body: form });
    setResult(await res.json());
    setLoading(false);
  };

  return (
    <div className="p-3 grid md:grid-cols-2 gap-3">
      <Card>
        <div className="text-xs uppercase tracking-wide text-[#6b7885] mb-2">Duty / FTL cross-check</div>
        <textarea value={desc} onChange={e=>setDesc(e.target.value)} rows={5}
          placeholder="e.g. Report 03:00L, 4 sectors, last sector ETA 14:30L, previous rest was 10h at home base…"
          className="w-full bg-[#0b0f14] border border-[#1c232c] rounded-lg p-2 text-sm outline-none focus:border-[#3b82f6]" />
        <button onClick={check} disabled={loading}
          className="mt-2 w-full bg-[#3b82f6] text-white text-sm font-medium py-2 rounded-lg disabled:opacity-50">
          {loading ? "Checking…" : "Check against my FRM/FOM"}
        </button>
        <div className="text-[10px] text-[#6b7885] mt-2">Advisory only — cross-checks the duty against your own uploaded manuals. Always confirm with crew scheduling/OCC.</div>
      </Card>
      <Card>
        {!result && <div className="text-sm text-[#6b7885]">Assessment will appear here.</div>}
        {result && (
          <div>
            <div className="text-sm whitespace-pre-wrap leading-relaxed">{result.assessment || result.explanation}</div>
            {result.citations && result.citations.map((c,i)=>(
              <div key={i} className="text-xs border border-[#1c232c] rounded-lg p-2 mt-2">
                <div className="text-[#8fb8ff] font-medium">{c.title} — p.{c.page}</div>
                <div className="text-[#9aa7b3] mt-1">{c.excerpt}</div>
              </div>
            ))}
          </div>
        )}
      </Card>
    </div>
  );
}

function AirportsTab() {
  const [airports, setAirports] = useState([]);
  const [form, setForm] = useState({ icao:"", iata:"", name:"", city:"", country:"" });
  const [sync, setSync] = useState({});
  const [filter, setFilter] = useState("");
  const [openBriefing, setOpenBriefing] = useState(null); // full record incl. attachments

  const load = () => fetch(`${API}/airports`).then(r=>r.json()).then(setAirports);
  useEffect(load, []);

  const add = async () => {
    if (!form.icao) return;
    const fd = new FormData();
    Object.entries(form).forEach(([k,v]) => fd.append(k, v));
    await fetch(`${API}/airports`, { method:"POST", body: fd });
    setForm({ icao:"", iata:"", name:"", city:"", country:"" });
    load();
  };

  const doSync = async (icao) => {
    const res = await fetch(`${API}/airports/${icao}/sync`);
    const data = await res.json().catch(()=>({}));
    setSync(s => ({ ...s, [icao]: data }));
  };

  const openFor = async (icao) => {
    const res = await fetch(`${API}/airports/${icao}/briefing`);
    setOpenBriefing(await res.json());
  };

  const shown = airports.filter(a =>
    !filter || a.icao.includes(filter.toUpperCase()) || (a.icao_real||"").includes(filter.toUpperCase())
  );

  return (
    <div className="p-3">
      <Card>
        <div className="text-xs uppercase tracking-wide text-[#6b7885] mb-2">Add airport</div>
        <div className="grid grid-cols-2 gap-2">
          {["icao","iata","name","city","country"].map(f => (
            <input key={f} placeholder={f.toUpperCase()} value={form[f]}
              onChange={e=>setForm({...form,[f]:e.target.value})}
              className="bg-[#0b0f14] border border-[#1c232c] rounded-lg p-2 text-sm" />
          ))}
        </div>
        <button onClick={add} className="mt-2 bg-[#3b82f6] text-white text-sm font-medium py-2 px-4 rounded-lg">Save</button>
      </Card>

      <input placeholder="Filter by code (e.g. ABJ, DIAP)…" value={filter} onChange={e=>setFilter(e.target.value)}
        className="w-full bg-[#0b0f14] border border-[#1c232c] rounded-lg p-2 text-sm mt-3" />

      <div className="grid md:grid-cols-2 gap-3 mt-3">
        {shown.map(a => (
          <Card key={a.icao}>
            <div className="flex justify-between items-start">
              <div className="cursor-pointer" onClick={()=>openFor(a.icao)}>
                <div className="font-medium text-sm">{a.icao} {a.icao_real ? `(${a.icao_real})` : ""}</div>
                <div className="text-xs text-[#6b7885]">{a.notes || "Tap to view full briefing"}</div>
              </div>
              <div className="flex gap-1 shrink-0">
                <button onClick={()=>openFor(a.icao)} className="text-xs bg-[#1c232c] px-2 py-1 rounded-md">Briefing</button>
                <button onClick={()=>doSync(a.icao)} className="text-xs bg-[#1c232c] px-2 py-1 rounded-md">Sync</button>
              </div>
            </div>
            {sync[a.icao] && (
              <pre className="text-[10px] text-[#9aa7b3] mt-2 whitespace-pre-wrap max-h-40 overflow-auto">
                {JSON.stringify(sync[a.icao], null, 2)}
              </pre>
            )}
          </Card>
        ))}
      </div>

      {openBriefing && (
        <div className="fixed inset-0 bg-black/70 flex items-start justify-center overflow-auto p-3 z-20"
             onClick={()=>setOpenBriefing(null)}>
          <div className="bg-[#111820] border border-[#1c232c] rounded-xl p-4 max-w-2xl w-full mt-6"
               onClick={e=>e.stopPropagation()}>
            <div className="flex justify-between items-start mb-2">
              <div className="font-medium">{openBriefing.icao} {openBriefing.icao_real ? `— ${openBriefing.icao_real}` : ""}</div>
              <button onClick={()=>setOpenBriefing(null)} className="text-[#6b7885] text-sm">Close</button>
            </div>
            <pre className="text-xs whitespace-pre-wrap leading-relaxed text-[#c9d3dc]">{openBriefing.briefing_md}</pre>
            {openBriefing.attachments && openBriefing.attachments.length > 0 && (
              <div className="mt-3 border-t border-[#1c232c] pt-3">
                <div className="text-xs uppercase tracking-wide text-[#6b7885] mb-2">Charts / attachments</div>
                <div className="flex flex-wrap gap-2">
                  {openBriefing.attachments.map((att,i) => (
                    <a key={i} href={`${API.replace('/api','')}/airport-files/${att.relpath}`} target="_blank" rel="noreferrer"
                      className="text-xs bg-[#1c232c] px-2 py-1 rounded-md text-[#8fb8ff]">
                      {att.filetype.toUpperCase()} · {att.filename.slice(0,10)}…
                    </a>
                  ))}
                </div>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

function EscapeRoutesTab() {
  const [docs, setDocs] = useState([]);
  const [active, setActive] = useState(null);
  const [query, setQuery] = useState("");

  useEffect(() => { fetch(`${API}/references`).then(r=>r.json()).then(setDocs); }, []);

  const open = async (id) => {
    const res = await fetch(`${API}/references/${id}`);
    setActive(await res.json());
  };

  // Split the body into blocks per exit-point heading for quick scanning/filtering
  const blocks = active ? active.body_md.split(/\n(?=[A-Z]{3,6}\s*\n|[A-Z]{3,6}\s*$)/m) : [];
  const filteredBlocks = query
    ? blocks.filter(b => b.toUpperCase().includes(query.toUpperCase()))
    : blocks;

  return (
    <div className="p-3 grid md:grid-cols-3 gap-3">
      <Card className="md:col-span-1">
        <div className="text-xs uppercase tracking-wide text-[#6b7885] mb-2">Reference documents</div>
        <div className="flex flex-col gap-2">
          {docs.map(d => (
            <button key={d.id} onClick={()=>open(d.id)}
              className={`text-left text-sm px-2 py-2 rounded-lg border ${active && active.id===d.id ? "border-[#3b82f6] bg-[#12233d]" : "border-[#1c232c]"}`}>
              {d.title}
              <div className="text-[10px] text-[#6b7885] uppercase">{d.category}</div>
            </button>
          ))}
          {docs.length===0 && <div className="text-sm text-[#6b7885]">No SID/escape-route reference docs indexed yet — run the seed script.</div>}
        </div>
      </Card>

      <Card className="md:col-span-2">
        {!active && <div className="text-sm text-[#6b7885]">Select a document to view exit points and routings.</div>}
        {active && (
          <div>
            <input placeholder="Filter by exit point (e.g. KONET, ALEMU)…" value={query} onChange={e=>setQuery(e.target.value)}
              className="w-full bg-[#0b0f14] border border-[#1c232c] rounded-lg p-2 text-sm mb-3" />
            <div className="flex flex-col gap-2 max-h-[70vh] overflow-auto">
              {filteredBlocks.map((b,i) => (
                <pre key={i} className="text-xs whitespace-pre-wrap leading-relaxed text-[#c9d3dc] border border-[#1c232c] rounded-lg p-2">{b.trim()}</pre>
              ))}
            </div>
          </div>
        )}
      </Card>
    </div>
  );
}

function BulletinsTab() {
  const [bulletins, setBulletins] = useState([]);
  const [form, setForm] = useState({ title:"", body:"", severity:"info" });
  const load = () => fetch(`${API}/bulletins`).then(r=>r.json()).then(setBulletins);
  useEffect(load, []);

  const create = async () => {
    if (!form.title || !form.body) return;
    const fd = new FormData();
    Object.entries(form).forEach(([k,v]) => fd.append(k, v));
    const res = await fetch(`${API}/bulletins`, { method:"POST", body: fd });
    const { id } = await res.json();
    setForm({ title:"", body:"", severity:"info" });
    load();
    return id;
  };

  const push = async (id) => {
    await fetch(`${API}/bulletins/${id}/push`, { method:"POST" });
    load();
  };

  return (
    <div className="p-3">
      <Card>
        <div className="text-xs uppercase tracking-wide text-[#6b7885] mb-2">New bulletin</div>
        <input placeholder="Title" value={form.title} onChange={e=>setForm({...form,title:e.target.value})}
          className="w-full bg-[#0b0f14] border border-[#1c232c] rounded-lg p-2 text-sm mb-2" />
        <textarea placeholder="Body" rows={3} value={form.body} onChange={e=>setForm({...form,body:e.target.value})}
          className="w-full bg-[#0b0f14] border border-[#1c232c] rounded-lg p-2 text-sm mb-2" />
        <div className="flex gap-2">
          <button onClick={create} className="bg-[#1c232c] text-sm px-3 py-2 rounded-lg">Save draft</button>
        </div>
      </Card>

      <div className="flex flex-col gap-2 mt-3">
        {bulletins.map(b => (
          <Card key={b.id}>
            <div className="flex justify-between items-start">
              <div>
                <div className="font-medium text-sm">{b.title}</div>
                <div className="text-xs text-[#9aa7b3] mt-1">{b.body}</div>
                <div className="text-[10px] text-[#6b7885] mt-1">{b.created_at} {b.pushed ? "· pushed" : ""}</div>
              </div>
              {!b.pushed && (
                <button onClick={()=>push(b.id)} className="text-xs bg-[#3b82f6] text-white px-2 py-1 rounded-md">Push</button>
              )}
            </div>
          </Card>
        ))}
      </div>
    </div>
  );
}

function SalaryTab() {
  const [inp, setInp] = useState({
    base_monthly_salary: 0, guaranteed_block_hours: 75, hourly_rate_above_guarantee: null,
    average_block_hours_flown: 75, per_diem_daily: 0, per_diem_days_per_month: 0,
    other_monthly_allowances: 0, currency: "USD",
  });
  const [result, setResult] = useState(null);

  const calc = async () => {
    const res = await fetch(`${API}/salary`, {
      method:"POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(inp)
    });
    setResult(await res.json());
  };

  const field = (key, label) => (
    <div className="mb-2">
      <label className="text-xs text-[#6b7885]">{label}</label>
      <input type="number" value={inp[key] ?? ""} onChange={e=>setInp({...inp,[key]: e.target.value===""?null:parseFloat(e.target.value)})}
        className="w-full bg-[#0b0f14] border border-[#1c232c] rounded-lg p-2 text-sm" />
    </div>
  );

  return (
    <div className="p-3 grid md:grid-cols-2 gap-3">
      <Card>
        {field("base_monthly_salary","Base monthly salary")}
        {field("guaranteed_block_hours","Guaranteed block hours / month")}
        {field("hourly_rate_above_guarantee","Hourly rate above guarantee (optional)")}
        {field("average_block_hours_flown","Average block hours flown / month")}
        {field("per_diem_daily","Per diem (daily)")}
        {field("per_diem_days_per_month","Per diem days / month")}
        {field("other_monthly_allowances","Other monthly allowances")}
        <button onClick={calc} className="mt-1 bg-[#3b82f6] text-white text-sm font-medium py-2 w-full rounded-lg">Calculate</button>
      </Card>
      <Card>
        {!result && <div className="text-sm text-[#6b7885]">Results appear here.</div>}
        {result && (
          <div className="text-sm space-y-1">
            <div>Effective hourly rate: <b>{result.effective_hourly_rate} {result.currency}</b></div>
            <div>Extra hours this month: {result.extra_hours_this_month}</div>
            <div>Extra pay this month: {result.extra_pay_this_month}</div>
            <div>Per diem (monthly): {result.per_diem_monthly}</div>
            <div>Monthly total: <b>{result.monthly_total}</b></div>
            <div>Annual total estimate: <b>{result.annual_total_estimate}</b></div>
            <div>Annual block hours estimate: {result.annual_block_hours_estimate}</div>
          </div>
        )}
      </Card>
    </div>
  );
}

function App() {
  const [tab, setTab] = useState("Ask");
  useEffect(() => { if (tg()) { tg().ready(); tg().expand(); } }, []);

  return (
    <div className="min-h-screen">
      <Nav tab={tab} setTab={setTab} />
      {tab==="Ask" && <AskTab/>}
      {tab==="Documents" && <DocumentsTab/>}
      {tab==="Legality" && <LegalityTab/>}
      {tab==="Airports" && <AirportsTab/>}
      {tab==="Escape Routes" && <EscapeRoutesTab/>}
      {tab==="Bulletins" && <BulletinsTab/>}
      {tab==="Salary" && <SalaryTab/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
