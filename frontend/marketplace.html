<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Crew Market · Pilot Reference</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f4fb;--ink:#17151f;--muted:#7d7989;--line:#e8e5ef;--card:#fff;--accent:#b51d55;--accent2:#7c3aed}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif}
body{padding-bottom:env(safe-area-inset-bottom)}
.font-display{font-family:"Space Grotesk",Inter,sans-serif}
.card{background:rgba(255,255,255,.9);border:1px solid rgba(226,222,235,.9);box-shadow:0 12px 35px rgba(42,28,65,.07);border-radius:24px}
.pill{border:1px solid var(--line);background:#fff;border-radius:999px}
input,textarea,select{font:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:#bca9d6;box-shadow:0 0 0 4px rgba(124,58,237,.08)}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:#d9d5e2;border-radius:99px}
.fade{animation:fade .25s ease-out}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hero{background:linear-gradient(135deg,#ffffff 0%,#f0edff 48%,#fff5e9 100%)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const API=(window.API_BASE||location.origin+"/api");
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();try{tg.setHeaderColor("#f5f4fb");tg.setBackgroundColor("#f5f4fb")}catch(e){}}

const state={items:[],filter:"all",query:"",city:"",clientId:"",loading:false,thread:null,showComposer:false};
const TYPES=[
 {id:"all",label:"All"},
 {id:"sell",label:"For sale"},
 {id:"buy",label:"Wanted"},
 {id:"currency",label:"Currency"},
 {id:"trip",label:"Trips"},
 {id:"service",label:"Services"}
];

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function uid(){
 const u=tg?.initDataUnsafe?.user;
 if(u?.id)return "tg:"+u.id;
 let id=localStorage.getItem("crew_market_client");
 if(!id){id="web:"+crypto.randomUUID();localStorage.setItem("crew_market_client",id)}
 return id;
}
state.clientId=uid();

function icon(name,size=18){
 const p={
  search:`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>`,
  plus:`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>`,
  back:`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>`,
  chat:`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 11.5a7.5 7.5 0 0 1-8 7.4 8.5 8.5 0 0 1-4.2-1.1L4 19l1.2-3.1A7.4 7.4 0 0 1 4.5 11 7.5 7.5 0 0 1 12 4a7.5 7.5 0 0 1 8 7.5Z"/></svg>`,
  plane:`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 16h20M5 16l2-7 10-3 3 3-8 3-2 4M9 16l-1 4M16 16l1 4"/></svg>`,
  close:`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg>`
 };
 return p[name]||"";
}

function typeMeta(t){
 return ({
  sell:["FOR SALE","bg-emerald-50 text-emerald-700 border-emerald-100"],
  buy:["WANTED","bg-sky-50 text-sky-700 border-sky-100"],
  currency:["CURRENCY","bg-amber-50 text-amber-700 border-amber-100"],
  trip:["TRIP","bg-violet-50 text-violet-700 border-violet-100"],
  service:["SERVICE","bg-rose-50 text-rose-700 border-rose-100"]
 }[t]||["MARKET","bg-gray-50 text-gray-600 border-gray-100"]);
}

function render(){
 document.getElementById("app").innerHTML=state.thread?threadPage():homePage();
}

function homePage(){
 return `<div class="max-w-3xl mx-auto px-4 pt-5 pb-10">
  <header class="flex items-center justify-between mb-5">
   <div>
    <div class="font-display text-[13px] font-semibold tracking-tight text-gray-500">PILOT REFERENCE</div>
    <h1 class="font-display text-3xl font-bold tracking-tight">Crew Market</h1>
   </div>
   <button onclick="openComposer()" class="w-12 h-12 rounded-2xl bg-gray-900 text-white grid place-items-center shadow-lg">${icon("plus",21)}</button>
  </header>

  <section class="hero card p-5 mb-4 overflow-hidden relative">
   <div class="relative z-10">
    <div class="inline-flex items-center gap-2 pill px-3 py-1.5 text-[11px] font-semibold text-gray-600 mb-3">
      ${icon("plane",13)} BUILT FOR CREW
    </div>
    <h2 class="font-display text-2xl sm:text-3xl font-bold max-w-xl">Trade, find & exchange things between layovers.</h2>
    <p class="text-sm text-gray-600 mt-2 max-w-xl">Crew-to-crew listings for travel essentials, currency, trips, services and useful items.</p>
   </div>
  </section>

  <div class="card p-3 mb-3">
   <div class="relative">
    <div class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">${icon("search",17)}</div>
    <input id="q" value="${esc(state.query)}" oninput="state.query=this.value;loadListings()" placeholder="Search chargers, USD, hotels, crew services…" class="w-full h-11 rounded-xl border border-gray-200 bg-gray-50 pl-10 pr-3 text-sm">
   </div>
   <div class="flex gap-2 overflow-x-auto mt-3 pb-1">
    ${TYPES.map(x=>`<button onclick="state.filter='${x.id}';loadListings()" class="pill px-3 py-2 text-xs whitespace-nowrap ${state.filter===x.id?'!bg-gray-900 !text-white !border-gray-900':'text-gray-600'}">${x.label}</button>`).join("")}
   </div>
  </div>

  <div class="flex items-center justify-between px-1 mb-2">
   <div class="text-xs font-semibold text-gray-500">${state.loading?"UPDATING…":`${state.items.length} LISTING${state.items.length===1?"":"S"}`}</div>
   <button onclick="loadListings()" class="text-xs font-semibold text-violet-700">Refresh</button>
  </div>
  <div class="space-y-3">${state.items.length?state.items.map(card).join(""):`<div class="card p-10 text-center fade"><div class="mx-auto w-14 h-14 rounded-2xl bg-white grid place-items-center text-gray-400 mb-3">${icon("search",22)}</div><div class="font-display font-semibold">Nothing here yet</div><div class="text-sm text-gray-500 mt-1">Be the first crew member to post something.</div><button onclick="openComposer()" class="mt-4 px-4 py-2.5 rounded-xl bg-gray-900 text-white text-sm font-semibold">Create listing</button></div>`}</div>
 </div>`;
}

function card(p){
 const [label,cls]=typeMeta(p.type);
 const title=esc(p.title);
 let detail=esc(p.description||"");
 if(p.type==="currency"){
   const bits=[];
   if(p.cur_amount)bits.push(`${p.cur_amount} USD`);
   if(p.cur_rate)bits.push(`@ ${p.cur_rate} ETB`);
   if(p.cur_direction)bits.push(p.cur_direction==="buy"?"buying":"selling");
   detail=bits.join(" · ")||detail;
 }
 if(p.trip_city)detail=[esc(p.trip_city),p.trip_date?esc(p.trip_date):"",detail].filter(Boolean).join(" · ");
 const who=p.anonymous?"Crew member":(p.poster_name||"Crew member");
 return `<article class="card p-4 fade">
  <div class="flex gap-3">
   <div class="w-12 h-12 rounded-2xl bg-gray-100 shrink-0 grid place-items-center text-gray-500">${icon(p.type==="trip"?"plane":"chat",20)}</div>
   <div class="min-w-0 flex-1">
    <div class="flex items-center gap-2 flex-wrap">
     <span class="px-2 py-1 rounded-full border text-[9px] font-bold tracking-wide ${cls}">${label}</span>
     ${p.trip_mode&&p.trip_mode!=="none"?`<span class="text-[10px] text-gray-400">${esc(p.trip_mode)}</span>`:""}
    </div>
    <h3 class="font-display font-semibold text-base mt-2">${title}</h3>
    <div class="text-sm text-gray-600 mt-1 line-clamp-2">${detail||"No description provided."}</div>
    <div class="flex items-center gap-2 text-[11px] text-gray-400 mt-3"><span>${esc(who)}</span><span>·</span><span>${esc(timeAgo(p.created_at))}</span></div>
   </div>
  </div>
  <div class="flex gap-2 mt-4">
    ${p.price_amount?`<div class="flex-1 rounded-xl bg-gray-50 px-3 py-2.5"><div class="text-[9px] uppercase tracking-wide text-gray-400">Price</div><div class="font-semibold text-sm">${esc(p.price_amount)} ${esc(p.price_currency||"")}</div></div>`:""}
    <button onclick="openChat(${p.id})" class="${p.price_amount?'':'flex-1'} px-4 py-2.5 rounded-xl bg-gray-900 text-white text-sm font-semibold flex items-center justify-center gap-2">${icon("chat",15)} Message</button>
  </div>
 </article>`;
}

function timeAgo(s){
 if(!s)return "recently";
 const d=new Date(s),m=Math.max(0,Math.round((Date.now()-d.getTime())/60000));
 if(m<1)return "just now"; if(m<60)return `${m}m ago`; const h=Math.round(m/60); if(h<24)return `${h}h ago`; return `${Math.round(h/24)}d ago`;
}

async function loadListings(){
 state.loading=true; render();
 const u=new URL(API+"/marketplace/listings");
 if(state.filter!=="all")u.searchParams.set("type",state.filter);
 if(state.query.trim())u.searchParams.set("query",state.query.trim());
 u.searchParams.set("client_id",state.clientId);
 try{const r=await fetch(u);const d=await r.json();state.items=Array.isArray(d)?d:[]}
 catch(e){state.items=[];toast("Could not load the market.");}
 state.loading=false;render();
}

function openComposer(){state.showComposer=true;render();}

function composer(){
 return `<div class="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4" onclick="if(event.target===this)closeComposer()">
  <div class="bg-white w-full sm:max-w-xl rounded-t-[28px] sm:rounded-[28px] max-h-[92vh] overflow-auto p-5">
   <div class="flex items-center justify-between mb-4"><div><div class="font-display text-xl font-bold">New listing</div><div class="text-xs text-gray-500 mt-1">Keep it clear and crew-friendly.</div></div><button onclick="closeComposer()" class="w-9 h-9 rounded-xl bg-gray-100 grid place-items-center">${icon("close",17)}</button></div>
   <form onsubmit="submitListing(event)" class="space-y-3">
    <select id="f_type" class="w-full h-12 rounded-xl border border-gray-200 bg-gray-50 px-3 text-sm">
     <option value="sell">For sale</option><option value="buy">Wanted</option><option value="currency">Currency exchange</option><option value="trip">Trip / ride / accommodation</option><option value="service">Crew service</option>
    </select>
    <input id="f_title" required maxlength="180" placeholder="Title · e.g. USD cash available in Addis" class="w-full h-12 rounded-xl border border-gray-200 bg-gray-50 px-3 text-sm">
    <textarea id="f_description" rows="3" maxlength="4000" placeholder="Description, condition, pickup details…" class="w-full rounded-xl border border-gray-200 bg-gray-50 p-3 text-sm"></textarea>
    <div class="grid grid-cols-2 gap-3">
      <input id="f_city" placeholder="City / destination" class="w-full h-12 rounded-xl border border-gray-200 bg-gray-50 px-3 text-sm">
      <input id="f_date" placeholder="Date (optional)" class="w-full h-12 rounded-xl border border-gray-200 bg-gray-50 px-3 text-sm">
    </div>
    <div id="currencyFields" class="hidden grid grid-cols-2 gap-3">
      <input id="f_amount" type="number" step="0.01" placeholder="USD amount" class="w-full h-12 rounded-xl border border-gray-200 bg-gray-50 px-3 text-sm">
      <input id="f_rate" type="number" step="0.01" placeholder="ETB / USD" class="w-full h-12 rounded-xl border border-gray-200 bg-gray-50 px-3 text-sm">
    </div>
    <div class="grid grid-cols-2 gap-3">
      <input id="f_name" maxlength="120" placeholder="Display name" class="w-full h-12 rounded-xl border border-gray-200 bg-gray-50 px-3 text-sm">
      <input id="f_phone" maxlength="80" placeholder="Phone (optional)" class="w-full h-12 rounded-xl border border-gray-200 bg-gray-50 px-3 text-sm">
    </div>
    <label class="flex items-center gap-2 text-xs text-gray-600"><input id="f_anonymous" type="checkbox" class="w-4 h-4"> Show as “Crew member”</label>
    <button class="w-full h-12 rounded-xl bg-gray-900 text-white text-sm font-semibold">Publish listing</button>
   </form>
  </div>
 </div>`;
}

document.addEventListener("change",e=>{
 if(e.target.id==="f_type"){
  document.getElementById("currencyFields")?.classList.toggle("hidden",e.target.value!=="currency");
 }
});

function closeComposer(){state.showComposer=false;render()}

async function submitListing(e){
 e.preventDefault();
 const fd=new FormData();
 const type=document.getElementById("f_type").value;
 fd.append("type",type);
 fd.append("title",document.getElementById("f_title").value);
 fd.append("description",document.getElementById("f_description").value);
 fd.append("client_id",state.clientId);
 fd.append("trip_city",document.getElementById("f_city").value);
 fd.append("trip_date",document.getElementById("f_date").value);
 fd.append("poster_name",document.getElementById("f_name").value);
 fd.append("contact_phone",document.getElementById("f_phone").value);
 fd.append("anonymous",document.getElementById("f_anonymous").checked);
 if(type==="currency"){
   fd.append("cur_amount",document.getElementById("f_amount").value);
   fd.append("cur_rate",document.getElementById("f_rate").value);
   fd.append("cur_direction","sell");
 }
 try{const r=await fetch(API+"/marketplace/listings",{method:"POST",body:fd});const d=await r.json();if(!r.ok)throw Error(d.detail||"Unable to publish");closeComposer();toast("Listing published.");loadListings()}catch(err){toast(err.message)}
}

async function openChat(id){
 const p=state.items.find(x=>x.id===id);
 try{
  const r=await fetch(`${API}/marketplace/listings/${id}/chat?client_id=${encodeURIComponent(state.clientId)}`);
  const d=await r.json(); if(!r.ok)throw Error(d.detail||"Unable to open chat");
  state.thread=d.is_owner?((d.threads||[])[0]||null):d.thread;
  state.currentListing=p;
  if(state.thread)render(); else toast("No conversation yet.");
 }catch(e){toast(e.message)}
}

function threadPage(){
 const t=state.thread,p=state.currentListing||{};
 return `<div class="max-w-2xl mx-auto min-h-screen flex flex-col">
  <header class="sticky top-0 z-10 bg-[rgba(245,244,251,.94)] backdrop-blur px-4 pt-4 pb-3 border-b border-gray-200">
   <div class="flex items-center gap-3">
    <button onclick="state.thread=null;render()" class="w-10 h-10 rounded-xl bg-white border border-gray-200 grid place-items-center">${icon("back",18)}</button>
    <div class="min-w-0 flex-1"><div class="font-display font-semibold truncate">${esc(p.title||"Crew Market")}</div><div class="text-[11px] text-gray-500">${esc(t?.counterpart_client_id||"Conversation")}</div></div>
   </div>
  </header>
  <main id="messages" class="flex-1 px-4 py-5 space-y-2 overflow-auto">
   ${(t?.messages||[]).map(m=>`<div class="flex ${m.sender_client_id===state.clientId?'justify-end':''}"><div class="max-w-[82%] rounded-2xl px-3.5 py-2.5 ${m.sender_client_id===state.clientId?'bg-gray-900 text-white':'bg-white border border-gray-200'}"><div class="text-sm whitespace-pre-wrap">${esc(m.text)}</div><div class="text-[9px] opacity-50 mt-1">${esc(timeAgo(m.created_at))}</div></div></div>`).join("")}
   ${!(t?.messages||[]).length?`<div class="text-center text-sm text-gray-500 py-16">Start the conversation. Keep payment and handover details clear.</div>`:""}
  </main>
  <form onsubmit="sendMessage(event)" class="sticky bottom-0 bg-[rgba(245,244,251,.96)] backdrop-blur p-3 pb-[calc(12px+env(safe-area-inset-bottom))]">
   <div class="flex gap-2 bg-white border border-gray-200 rounded-2xl p-2"><input id="msg" autocomplete="off" placeholder="Message crew member…" class="flex-1 px-2 text-sm outline-none"><button class="w-10 h-10 rounded-xl bg-gray-900 text-white grid place-items-center">${icon("chat",16)}</button></div>
  </form>
 </div>`;
}

async function sendMessage(e){
 e.preventDefault();const text=msg.value.trim();if(!text||!state.thread)return;
 const fd=new FormData();fd.append("client_id",state.clientId);fd.append("text",text);
 try{await fetch(`${API}/marketplace/threads/${state.thread.id}/messages`,{method:"POST",body:fd});const r=await fetch(`${API}/marketplace/threads/${state.thread.id}?client_id=${encodeURIComponent(state.clientId)}`);state.thread=await r.json();render();setTimeout(()=>document.getElementById("messages")?.scrollTo(0,99999),30)}catch(e){toast("Message failed.")} 
}

function toast(text){
 const d=document.createElement("div");d.className="fixed left-1/2 -translate-x-1/2 bottom-6 z-[100] bg-gray-900 text-white text-xs font-medium px-4 py-3 rounded-xl shadow-xl";d.textContent=text;document.body.appendChild(d);setTimeout(()=>d.remove(),2400);
}

const originalRender=render;
render=()=>{document.getElementById("app").innerHTML=state.thread?threadPage():homePage();if(state.showComposer)document.body.insertAdjacentHTML("beforeend",composer())};

loadListings();
</script>
</body>
</html>
